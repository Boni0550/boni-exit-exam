e result into sales."}, "answer": "A", "explanation": "Both ratios divide sales (6,676.6) by an asset base: 6,676.6 ÷ 2,932.9 = 2.28 and 6,676.6 ÷ 5,050 = 1.32. The larger denominator for total assets lowers the ratio."}, {"id": 28, "question": "A firm has total debt of Br. 3,000,000, total equity of Br. 2,000,000 and total assets of Br. 5,000,000. What is its debt ratio (debt to total assets)?", "options": {"A": "40%", "B": "60%", "C": "150%", "D": "167%"}, "answer": "B", "explanation": "Debt ratio = total debt ÷ total assets = 3,000,000 ÷ 5,000,000 = 60%."}, {"id": 29, "question": "What does the debt-to-equity ratio measure?", "options": {"A": "The number of times annual interest payments are covered by the earnings before interest and taxes of the period", "B": "The percentage of the firm’s total assets that is financed with borrowed funds rather than with owners’ funds", "C": "The ability of the firm to meet its current liabilities from its most liquid assets", "D": "The relative claims of creditors and owners on the assets, comparing creditor funds with shareholder funds"}, "answer": "D", "explanation": "Debt to equity measures the relative claims of creditors and owners against the firm’s assets by comparing creditor funds with shareholder funds. The other options describe TIER, the debt ratio and the quick/cash ratios."}, {"id": 30, "question": "A firm has earnings before interest and taxes (EBIT) of Br. 480,000, interest expense of Br. 120,000 and income tax of Br. 144,000. What is its times interest earned (TIER) ratio?", "options": {"A": "0.25", "B": "3.0", "C": "4.0", "D": "5.0"}, "answer": "C", "explanation": "TIER = EBIT ÷ interest expense = 480,000 ÷ 120,000 = 4.0 times."}, {"id": 31, "question": "A creditor must choose the least risky borrower among four firms of similar size. Based on the chapter’s view of leverage ratios, which firm should it prefer?", "options": {"A": "Firm X: debt ratio 70% and TIER 6.0 times", "B": "Firm Y: debt ratio 40% and TIER 1.5 times", "C": "Firm W: debt ratio 40% and TIER 6.0 times", "D": "Firm Z: debt ratio 70% and TIER 1.5 times"}, "answer": "C", "explanation": "Leverage ratios show how much of the assets is debt-financed and the ability to service debt; creditors dislike a low TIER. Firm W combines the lowest debt share with the strongest interest coverage."}, {"id": 32, "question": "A firm’s net sales are Br. 8,000,000 and its cost of goods sold is Br. 5,200,000. What is its gross profit margin?", "options": {"A": "35.0%", "B": "53.8%", "C": "65.0%", "D": "153.8%"}, "answer": "A", "explanation": "Gross profit margin = (sales − cost of goods sold) ÷ sales = 2,800,000 ÷ 8,000,000 = 35.0%."}, {"id": 33, "question": "Biftu Company’s net profit margin for 2012 is 8%. How should this result be interpreted?", "options": {"A": "Biftu earned 8 cents of profit for every birr invested in total assets.", "B": "Biftu earned 8 cents of profit for every birr of owners’ equity.", "C": "Biftu retained 8 cents of every birr of net sales after paying dividends.", "D": "Biftu generated 8 cents of net income for every birr of net sales."}, "answer": "D", "explanation": "Net profit margin = net income ÷ sales (531 ÷ 6,676.6 ≈ 8%), i.e. the cents of net income per birr of sales. Returns on assets and equity are the ROI and ROE ratios."}, {"id": 34, "question": "Biftu’s 2012 net income is Br. 531 million, total assets Br. 5,050 million and stockholders’ equity Br. 1,282.4 million, giving ROI of 10.5% and ROE of 41.4%. Which statement best explains why ROE is far above ROI?", "options": {"A": "Net income is divided by a much smaller equity base, since about 75% of assets are financed by debt.", "B": "ROE uses sales in the numerator, and the sales of the year are much larger than the net income earned.", "C": "ROI is calculated after dividends have been paid, while ROE is calculated before any dividends are paid out.", "D": "ROE is measured at the market value of the shares, while ROI is measured at the book value of the assets."}, "answer": "A", "explanation": "ROI = 531 ÷ 5,050 = 10.5% and ROE = 531 ÷ 1,282.4 = 41.4%. Both use net income; equity is far smaller than assets because the debt ratio is about 75%."}, {"id": 35, "question": "A company earned a net profit of Br. 600,000, has 150,000 shares outstanding and its shares trade at Br. 48. What is its price-earnings (P/E) ratio?", "options": {"A": "0.08", "B": "4.00", "C": "12.00", "D": "48.00"}, "answer": "C", "explanation": "EPS = 600,000 ÷ 150,000 = Br. 4; P/E = market price per share ÷ EPS = 48 ÷ 4 = 12."}, {"id": 36, "question": "A company has total stockholders’ equity of Br. 2,400,000, 120,000 common shares outstanding and a market price of Br. 30 per share. What is its market-to-book ratio?", "options": {"A": "0.67", "B": "1.50", "C": "20.00", "D": "30.00"}, "answer": "B", "explanation": "Book value per share = 2,400,000 ÷ 120,000 = Br. 20; market-to-book = 30 ÷ 20 = 1.50."}, {"id": 37, "question": "What does a high market-to-book ratio indicate, according to the chapter?", "options": {"A": "The firm’s shares are valued at less than the net assets reported on its balance sheet at year end for stockholders.", "B": "Investors place a high value on the firm’s expected growth relative to its physical (book) assets.", "C": "The firm distributes most of its earnings as dividends rather than retaining them.", "D": "The firm holds large amounts of excess liquidity and uses very little borrowing."}, "answer": "B", "explanation": "The market-to-book ratio is a relative measure of how the firm’s growth options are valued against its physical assets: the greater the expected growth and the value placed on it, the greater the ratio."}, {"id": 38, "question": "Which statement best explains why the sales forecast is regarded as the most crucial step in financial forecasting?", "options": {"A": "It is the only step that does not require assumptions about costs, tax rates, interest charges or dividends.", "B": "It fixes the dividend payout ratio, which then determines the firm’s financing mix in the forecast period.", "C": "It removes the need to forecast assets because assets remain constant when sales change in the period.", "D": "Income, retained earnings, asset needs and financing all rest on it, so an error hurts profit and value."}, "answer": "D", "explanation": "The sales forecast is the base for the income statement (and so retained earnings) and for the asset requirement; if it is off, profitability and value are negatively affected."}, {"id": 39, "question": "A firm operating at full capacity expects its sales to rise by 15%. Which sequence best reflects the reasoning in the chapter?", "options": {"A": "Cash, receivables, inventory and plant must all grow; retained earnings and spontaneous liabilities cover part, and the rest is external.", "B": "Only fixed assets must grow, since all current assets are financed automatically through accounts payable and accruals, so no outside funds are required.", "C": "Assets need not grow, because the higher sales are financed entirely by the additional net income that the firm earns.", "D": "Assets and long-term debt grow in proportion to sales, so no external financing is ever needed by the firm."}, "answer": "A", "explanation": "If sales increase, assets must also grow (cash, receivables, inventory, plant). Part is financed by retained earnings and spontaneous liabilities; the remainder must be raised externally (AFN)."}, {"id": 40, "question": "As a firm’s sales increase, its purchases rise and its accounts payable and accrued salaries grow automatically. How does the chapter classify this source of funds?", "options": {"A": "Retained earnings financing", "B": "Spontaneous financing", "C": "Additional funds needed (AFN)", "D": "Long-term debt financing"}, "answer": "B", "explanation": "Trade credit, outstanding expenses and accruals such as salaries payable that rise automatically with sales are examples of spontaneous financing."}, {"id": 41, "question": "Which assumption underlies the formula method of forecasting financial requirements?", "options": {"A": "Fixed assets operate with excess capacity, so they grow more slowly than sales while other assets grow with sales.", "B": "Long-term debt and common stock rise in proportion to sales, while the payout ratio changes in each year.", "C": "Assets, payables and accruals vary directly with sales, while the profit margin and payout ratio stay constant.", "D": "The profit margin rises with sales, so retained earnings finance all of the asset growth in the period."}, "answer": "C", "explanation": "The formula method assumes each asset has a direct proportionate relationship with sales, accounts payable and accruals rise in proportion to sales, and the profit margin and payout ratio are constant."}, {"id": 42, "question": "Other factors held constant, which change would REDUCE a firm’s additional funds needed (AFN)?", "options": {"A": "A higher dividend payout ratio", "B": "A higher capital intensity ratio (A/S)", "C": "A higher projected sales growth rate", "D": "A higher net profit margin"}, "answer": "D", "explanation": "AFN and profit margin move in opposite directions; AFN rises with sales growth, capital intensity and the dividend payout ratio."}, {"id": 43, "question": "A firm wants to lower its need for external financing without reducing its planned sales growth. Which action is consistent with the chapter’s analysis of AFN?", "options": {"A": "Retain a larger share of earnings by lowering the dividend payout ratio", "B": "Raise the dividend payout ratio to signal strength to shareholders", "C": "Shift to more capital-intensive production methods that need larger investments in plant", "D": "Accept a lower net profit margin in order to attract more customers"}, "answer": "A", "explanation": "The higher the payout ratio, the smaller the addition to retained earnings and the greater the external financing needed; a lower payout therefore reduces AFN. Higher capital intensity and a lower margin both raise AFN."}, {"id": 44, "question": "A manager must choose between the two methods of forecasting financial requirements and wants meaningful, detailed output. Which choice and justification is most appropriate?", "options": {"A": "Use the formula method, because it produces complete projected statements more quickly than the pro forma method does, at no loss of detail.", "B": "Use the pro forma method, because it shows each asset, liability and equity item, while the formula output is less meaningful.", "C": "Use the formula method, because it does not assume that assets grow directly with sales in the forecast.", "D": "Use the pro forma method, because it requires no assumptions about costs, tax rates or dividends at all."}, "answer": "B", "explanation": "The formula method is a quick shortcut, but many companies use the pro forma method because the output of the formula method is less meaningful."}, {"id": 45, "question": "Compared with its AFN under the full-capacity assumption, how does a firm’s AFN change when it has excess capacity in fixed assets, and why?", "options": {"A": "AFN is larger, because the unused capacity must be financed in addition to the normal growth of the other assets.", "B": "AFN is unchanged, because fixed assets are financed only by long-term debt.", "C": "AFN is larger, because the target fixed assets to sales ratio increases.", "D": "AFN is smaller, because required fixed assets grow by less than sales when existing capacity is partly unused."}, "answer": "D", "explanation": "Blue Nile’s required fixed assets fall from Br. 407,000 (proportional growth) to Br. 396,000 with excess capacity, so AFN declines from Br. 9,080 to Br. −1,920."}, {"id": 46, "question": "Last year a firm had sales of Br. 2,000,000 and operating costs of Br. 1,700,000. Next year sales are expected to grow by 20% and operating costs will increase proportionately. Interest expense will be Br. 50,000, the tax rate is 40% and the dividend payout ratio is 50%. What is the projected addition to retained earnings?", "options": {"A": "Br. 74,400", "B": "Br. 93,000", "C": "Br. 111,600", "D": "Br. 186,000"}, "answer": "B", "explanation": "Sales 2,400,000; costs 2,040,000; EBIT 360,000; EBT 310,000; tax 124,000; net income 186,000; dividends 93,000; addition to retained earnings 186,000 − 93,000 = 93,000."}, {"id": 47, "question": "A firm has sales of Br. 2,000,000 and total assets of Br. 1,200,000, all of which vary directly with sales. Accounts payable and accruals total Br. 200,000 and also vary with sales. Sales are expected to grow by 20%; the net profit margin is 5% and the payout ratio is 40%. Using AFN = (A/S)ΔS − (L/S)ΔS − MS1(1 − d), what is the AFN?", "options": {"A": "Br. 128,000", "B": "Br. 140,000", "C": "Br. 152,000", "D": "Br. 200,000"}, "answer": "A", "explanation": "A/S = 0.6; L/S = 0.1; ΔS = 400,000; S1 = 2,400,000. AFN = 0.6(400,000) − 0.1(400,000) − 0.05(2,400,000)(0.6) = 240,000 − 40,000 − 72,000 = 128,000."}, {"id": 48, "question": "Blue Nile’s pro forma statements project net income of Br. 94,800, an addition to retained earnings of Br. 37,920 (60% payout), total assets of Br. 660,000 and AFN of Br. 9,080. If the firm instead paid out only 40% of net income and nothing else changed, what would the AFN be?", "options": {"A": "Br. −9,880", "B": "Br. −1,920", "C": "Br. 9,080", "D": "Br. 28,040"}, "answer": "A", "explanation": "At a 40% payout, retained earnings addition = 60% × 94,800 = 56,880, which is 18,960 more than 37,920. AFN = 9,080 − 18,960 = Br. −9,880 (a surplus)."}, {"id": 49, "question": "A firm’s fixed assets are Br. 180,000. It produced actual sales of Br. 900,000 while operating at 90% of fixed-asset capacity, and projected sales are Br. 1,000,000. Using the chapter’s procedure, what is the required level of fixed assets and how does it compare with growing fixed assets in proportion to sales?", "options": {"A": "Br. 162,000, which is Br. 38,000 lower", "B": "Br. 180,000, which is Br. 20,000 lower", "C": "Br. 200,000, which is the same", "D": "Br. 220,000, which is Br. 20,000 higher"}, "answer": "B", "explanation": "Full-capacity sales = 900,000 ÷ 0.90 = 1,000,000; target fixed assets/sales = 180,000 ÷ 1,000,000 = 18%; required fixed assets = 18% × 1,000,000 = 180,000. Proportional growth would give 180,000 × (1,000,000 ÷ 900,000) = 200,000, so the requirement is 20,000 lower."}, {"id": 50, "question": "For Blue Nile, the formula method (5% net profit margin) gives an AFN of Br. 7,400, while the pro forma method gives Br. 9,080. Which explanation accounts for the Br. 1,680 difference?", "options": {"A": "The formula method omits the Br. 13,000 spontaneous increase in liabilities that the pro forma method includes in its computation.", "B": "The pro forma method assumes a 60% payout ratio, whereas the formula method assumes that no dividends are paid at all.", "C": "Pro forma net income (Br. 94,800) is about 4.8% of sales, not 5%, so retained earnings rise by Br. 37,920 rather than Br. 39,600.", "D": "The formula method uses a smaller required increase in assets than the Br. 60,000 used in the pro forma method."}, "answer": "C", "explanation": "Both methods use a Br. 60,000 asset increase, Br. 13,000 spontaneous liabilities and a 60% payout. Retained earnings differ: 5% × 1,980,000 × 0.4 = 39,600 versus 37,920 under the pro forma method; 39,600 − 37,920 = 1,680 = 9,080 − 7,400."}]};

/* ---------- Course catalogue ---------- */
const courses = [
 {id:'business', title:'Business Ethics', sets:[{label:'All chapters', q:quizzes.business}]},
 {id:'risk', title:'Risk Management & Insurance', sets:[{label:'All chapters', q:quizzes.risk}]},
 {id:'fm1', title:'Financial Management I', sets:[
    {label:'Chapter 1: Basic Concepts of Financial Management', q:quizzes.fm1c1},
    {label:'Chapter 2: Financial Statement Analysis and Forecasting', q:quizzes.fm1c2}
 ]}
];
const COUNT_CHOICES=[30,50,100];

let current=[],course=null,index=0,answers={};
let timeLeft=0, timerInterval=null;
let setupCourse=null, setupSet='all', setupCount=0;

const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const poolFor=(c,key)=>key==='all'?c.sets.flatMap(s=>s.q):c.sets[+key].q;

/* ---------- Home ---------- */
function buildHome(){
 document.getElementById('courseGrid').innerHTML=courses.map((c,i)=>{
  const total=poolFor(c,'all').length;
  const extra=c.sets.length>1?` &middot; ${c.sets.length} chapters`:'';
  return `<div class="card"><h2>${esc(c.title)}</h2><p>${total} Multiple Choice Questions${extra}</p><button onclick="openSetup(${i})">Start ${esc(c.title)}</button></div>`;
 }).join('');
}

/* ---------- Setup screen (chapter + number of questions) ---------- */
function openSetup(i){
 setupCourse=courses[i]; setupSet='all'; setupCount=0;
 document.getElementById('home').classList.add('hidden');
 document.getElementById('setup').classList.remove('hidden');
 document.getElementById('setupTitle').textContent=setupCourse.title;
 const multi=setupCourse.sets.length>1;
 document.getElementById('chapterBlock').classList.toggle('hidden',!multi);
 document.getElementById('countHeading').textContent=(multi?'2. ':'')+'How many questions do you want to answer?';
 if(multi){
  const opts=[{key:'all',label:'Both chapters',n:poolFor(setupCourse,'all').length},
              ...setupCourse.sets.map((s,k)=>({key:String(k),label:s.label,n:s.q.length}))];
  document.getElementById('chapterChoices').innerHTML=opts.map(o=>
   `<label class="choice chapter-choice" data-key="${o.key}"><input type="radio" name="chapter" value="${o.key}" onchange="pickSet('${o.key}')"><b>${esc(o.label)}</b><small>${o.n} questions</small></label>`).join('');
 }
 pickSet('all');
}
function pickSet(key){
 setupSet=key;
 document.querySelectorAll('#chapterChoices .choice').forEach(l=>l.classList.toggle('selected',l.dataset.key===key));
 const n=poolFor(setupCourse,key).length;
 const counts=COUNT_CHOICES.filter(c=>c<=n);
 if(!counts.includes(n)) counts.push(n);          // always offer "all questions"
 if(!counts.includes(setupCount)) setupCount=counts.includes(30)?30:counts[0];
 document.getElementById('countChoices').innerHTML=counts.map(c=>
  `<label class="choice" data-count="${c}"><input type="radio" name="count" value="${c}" onchange="pickCount(${c})"><b>${c}</b><small>${c===n?'all questions':'questions'}</small></label>`).join('');
 pickCount(setupCount);
}
function pickCount(c){
 setupCount=c;
 document.querySelectorAll('#countChoices .choice').forEach(l=>l.classList.toggle('selected',+l.dataset.count===c));
 const n=poolFor(setupCourse,setupSet).length;
 document.getElementById('setupInfo').innerHTML=`<b>${c}</b> question(s)`+(c<n?` picked at random from ${n}`:'')+` &middot; Time allowed: <b>${c} minutes</b>`;
}
function beginExam(){
 let pool=poolFor(setupCourse,setupSet).slice();
 for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}   // random pick
 let picked=pool.slice(0,setupCount);
 if(!document.getElementById('shuffleBox').checked){
  const order=poolFor(setupCourse,setupSet); picked.sort((a,b)=>order.indexOf(a)-order.indexOf(b));
 }
 const chapterName=setupCourse.sets.length>1?(setupSet==='all'?'Both chapters':setupCourse.sets[+setupSet].label.split(':')[0]):'';
 startQuiz(picked,setupCourse.title+(chapterName?' ('+chapterName+')':''),setupCount);
}

/* ---------- Timer ---------- */
function startTimer(minutes){
 clearInterval(timerInterval);
 timeLeft=minutes*60;
 updateTimer();
 timerInterval=setInterval(()=>{
   timeLeft--;
   updateTimer();
   if(timeLeft<=0){
     clearInterval(timerInterval);
     alert('Time is up! Your quiz will now be submitted.');
     showResult();
   }
 },1000);
}
function updateTimer(){
 const mins=Math.floor(Math.max(timeLeft,0)/60);
 const secs=Math.max(timeLeft,0)%60;
 document.getElementById('timer').textContent=`Time: ${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
}

/* ---------- Quiz ---------- */
function startQuiz(questions,title,minutes){
 current=questions; index=0; answers={};
 document.getElementById('home').classList.add('hidden');
 document.getElementById('setup').classList.add('hidden');
 document.getElementById('result').classList.add('hidden');
 document.getElementById('quiz').classList.remove('hidden');
 document.getElementById('courseTitle').textContent=title;
 startTimer(minutes);
 buildNav();
 renderQuestion();
}
function renderQuestion(){
 const q=current[index];
 document.getElementById('counter').textContent=`Question ${index+1} of ${current.length}`;
 document.getElementById('bar').style.width=((index+1)/current.length*100)+'%';
 document.getElementById('question').textContent=q.question;
 let out='';
 Object.entries(q.options).forEach(([letter,text])=>{
  const checked=answers[index]===letter?'checked':'';
  out+=`<label class="option"><input type="radio" name="answer" value="${letter}" ${checked} onchange="answers[${index}]='${letter}';updateNav()"> <b>${letter}.</b> ${esc(text)}</label>`;
 });
 document.getElementById('options').innerHTML=out;
 document.getElementById('nextBtn').textContent=index===current.length-1?'Submit Quiz':'Next';
 updateNav();
}
function buildNav(){
 document.getElementById('navGrid').innerHTML=current.map((q,i)=>`<button class="nav-btn" id="nav${i}" onclick="goToQuestion(${i})">${i+1}</button>`).join('');
}
function updateNav(){
 current.forEach((q,i)=>{
  const b=document.getElementById('nav'+i); if(!b) return;
  b.classList.toggle('answered',!!answers[i]);
  b.classList.toggle('current',i===index);
 });
 const cur=document.getElementById('nav'+index);
 if(cur) cur.scrollIntoView({block:'nearest',inline:'nearest'});
}
function goToQuestion(i){index=i;renderQuestion();}
function nextQuestion(){
 if(index===current.length-1){submitExam(true);}else{index++;renderQuestion();}
}
function previousQuestion(){if(index>0){index--;renderQuestion();}}
function showResult(){
 document.getElementById('modal').classList.add('hidden');
 clearInterval(timerInterval);
 document.getElementById('quiz').classList.add('hidden');
 document.getElementById('result').classList.remove('hidden');
 let correct=current.filter((q,i)=>answers[i]===q.answer).length;
 let pct=Math.round(correct/current.length*100);
 document.getElementById('score').textContent=`${correct} / ${current.length} (${pct}%)`;
 document.getElementById('message').textContent=pct>=80?'Excellent work!':pct>=50?'Good effort! Keep practicing.':'Keep studying and try again!';
 document.getElementById('review').classList.add('hidden');
}
function reviewAnswers(){
 const r=document.getElementById('review'); r.classList.remove('hidden');
 r.innerHTML='<h2>Answer Review</h2>'+current.map((q,i)=>{
   const user=answers[i]||'No answer'; const ok=user===q.answer;
   const exp=q.explanation?`<p class="exp"><b>Explanation:</b> ${esc(q.explanation)}</p>`:'';
   return `<div class="quiz-card" style="margin-bottom:14px"><b style="white-space:pre-line">Q${i+1}. ${esc(q.question)}</b><p class="${ok?'correct':'wrong'}">Your answer: ${user} ${ok?'✓':'✗'}</p><p class="correct">Correct answer: ${q.answer}. ${esc(q.options[q.answer])}</p>${exp}</div>`;
 }).join('');
}
function backToCourses(){goHome();}
function submitExam(fromLast){
 const left=current.filter((q,i)=>!answers[i]).length;
 if(fromLast && left===0){showResult();return;}
 const msg=left?`You have ${left} unanswered question(s). Submit the exam anyway?`:'Submit your exam now?';
 const m=document.getElementById('modal');
 document.getElementById('modalMsg').textContent=msg;
 m.classList.remove('hidden');
 document.getElementById('modalYes').onclick=()=>{m.classList.add('hidden');showResult();};
 document.getElementById('modalNo').onclick=()=>m.classList.add('hidden');
}
function goHome(){
 clearInterval(timerInterval);
 ['result','quiz','setup'].forEach(id=>document.getElementById(id).classList.add('hidden'));
 document.getElementById('home').classList.remove('hidden');
}
buildHome();
</script>
</body></html>
