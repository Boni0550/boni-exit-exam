lists available insurance policies", "B": "Insurance policy checklist: records the firm's past claims; exposure unit checklist: lists the firm's contracts", "C": "Both types list only the firm's insured property and nothing else", "D": "Insurance policy checklist: lists common insurable risks and the policies that cover them; exposure unit checklist: identifies common sources of loss exposure within a specific industry or organization"}, "answer": "D"}, {"id": 70, "question": "A risk manager maps the sequence of activities from raw material supply to delivery of finished goods to find critical points, weaknesses, and bottlenecks where equipment failure or supply shortages could disrupt operations. Which technique is this?", "options": {"A": "Organization chart", "B": "Flow charts", "C": "Financial statement method", "D": "Contract analysis"}, "answer": "B"}, {"id": 71, "question": "A risk manager examines each account on the balance sheet, and reviews income statements, budgets, and forecasts, to detect property, liability, and human asset exposures, as well as future risks. Which technique is this?", "options": {"A": "Financial statement method", "B": "Physical inspection", "C": "Organization chart", "D": "Checklist"}, "answer": "A"}, {"id": 72, "question": "Match each activity with the correct identification technique: (i) reviewing supplier agreements to see who bears liability; (ii) regular meetings with the production department to learn about risks not visible elsewhere; (iii) analyzing budgets and forecasts.", "options": {"A": "(i) interactions with other departments; (ii) contract analysis; (iii) financial statement method", "B": "(i) financial statement method; (ii) contract analysis; (iii) interactions with other departments", "C": "(i) contract analysis; (ii) financial statement method; (iii) interactions with other departments", "D": "(i) contract analysis; (ii) interactions with other departments; (iii) financial statement method"}, "answer": "D"}, {"id": 73, "question": "A business operates 5 delivery trucks. A truck involved in an accident is a total loss, and new trucks are bought each year so that the fleet always starts the year with 5. Which distribution method suits this case and why?", "options": {"A": "The binomial distribution, because n units are independently exposed and each experiences at most one loss in a year", "B": "The Poisson distribution, because each truck can suffer several accidents a year", "C": "The Poisson distribution, because the trucks are never replaced", "D": "Neither, because the number of exposure units changes each year"}, "answer": "A"}, {"id": 74, "question": "A firm operated 8 vans in each of 5 years (40 van-years) and recorded 6 accidents in total. Using the unit's method, what is the expected number of accidents next year for the 8 vans?", "options": {"A": "0.15 accidents", "B": "6 accidents", "C": "1.2 accidents", "D": "0.75 accidents"}, "answer": "C"}, {"id": 75, "question": "Three units are independently exposed, each with a probability of accident of 0.2. Using P(r) = [n! ÷ ((n − r)! r!)] pʳ qⁿ⁻ʳ, what is the probability of exactly one accident?", "options": {"A": "0.384", "B": "0.128", "C": "0.096", "D": "0.512"}, "answer": "A"}, {"id": 76, "question": "A fleet has n = 20 units, and the probability of an accident per unit is p = 0.1. What are the mean and standard deviation of the number of accidents under the binomial distribution?", "options": {"A": "Mean = 2.0; SD = 1.80", "B": "Mean = 2.0; SD ≈ 1.34", "C": "Mean = 1.8; SD ≈ 1.34", "D": "Mean = 18; SD ≈ 4.24"}, "answer": "B"}, {"id": 77, "question": "For the same fleet (n = 20, p = 0.1, mean = 2, SD ≈ 1.342), what are the risk relative to the mean (RM) and the risk relative to the number of exposure units (Rn)?", "options": {"A": "RM ≈ 6.7% and Rn ≈ 67.1%", "B": "RM ≈ 67.1% and Rn ≈ 67.1%", "C": "RM ≈ 67.1% and Rn ≈ 6.7%", "D": "RM ≈ 90% and Rn ≈ 9%"}, "answer": "C"}, {"id": 78, "question": "Which statement correctly distinguishes risk relative to the mean (RM) from risk relative to the number of exposure units (Rn)?", "options": {"A": "RM divides the standard deviation by the number of exposure units, whereas Rn divides it by the mean", "B": "RM measures the probability of an accident, whereas Rn measures the monetary loss", "C": "RM and Rn are identical and are always equal", "D": "RM expresses the standard deviation as a proportion of the expected number of accidents, whereas Rn expresses it as a percentage of the total number of exposure units"}, "answer": "D"}, {"id": 79, "question": "A fleet of 20 trucks has p = 0.1, so 2 accidents are expected per year, and each accident costs on average Br 8,000. What is the expected total annual monetary loss?", "options": {"A": "Br 16,000", "B": "Br 8,000", "C": "Br 2,000", "D": "Br 80,000"}, "answer": "A"}, {"id": 80, "question": "For the same fleet (SD of accidents ≈ 1.342, loss per accident Br 8,000, expected annual loss Br 16,000), what are the standard deviation of total monetary loss and the risk relative to the mean monetary loss?", "options": {"A": "SD ≈ Br 16,000; RM ≈ 1.0", "B": "SD ≈ Br 8,000; RM ≈ 0.5", "C": "SD ≈ Br 10,733; RM ≈ 0.67", "D": "SD ≈ Br 1,342; RM ≈ 0.08"}, "answer": "C"}, {"id": 81, "question": "Three independent units each have an accident probability of 0.2. What is the probability that the firm will experience some loss, meaning at least one accident?", "options": {"A": "0.512", "B": "0.488", "C": "0.384", "D": "0.200"}, "answer": "B"}, {"id": 82, "question": "What is the only data input required to construct a Poisson distribution of accidents?", "options": {"A": "The number of units and the probability of no accident, separately", "B": "The mean, that is, the expected or average number of accidents", "C": "The total value of all exposure units", "D": "The largest loss recorded in previous years"}, "answer": "B"}, {"id": 83, "question": "A firm holds many properties of different values. Any one property can suffer more than one accident in a year, and damaged property is not replaced. Which distribution and which assumptions apply?", "options": {"A": "The binomial distribution, because exposure units are independent and each has at most one loss", "B": "The binomial distribution, because the number of units is fixed by replacement", "C": "The Poisson distribution, whose assumptions are that object values may differ, each object can suffer more than one accident, and there is no replacement", "D": "No distribution can be used, because the values differ"}, "answer": "C"}, {"id": 84, "question": "Over 10 years a firm recorded 12 accidents against a total of 150 car-years of exposure. In year 11 it operates 50 cars. What are the Poisson mean and standard deviation for year 11?", "options": {"A": "M = 4 accidents; SD = 4", "B": "M = 12 accidents; SD ≈ 3.46", "C": "M = 0.08 accidents; SD ≈ 0.28", "D": "M = 4 accidents; SD = 2"}, "answer": "D"}, {"id": 85, "question": "For a Poisson distribution with mean M = 2, and using e = 2.71828, what is the probability of exactly 3 accidents?", "options": {"A": "Approximately 0.180", "B": "Approximately 0.271", "C": "Approximately 0.090", "D": "Approximately 0.135"}, "answer": "A"}, {"id": 86, "question": "For a Poisson distribution with mean M = 2, what is the probability that at least 2 accidents occur, using P(0) ≈ 0.1353 and P(1) ≈ 0.2707?", "options": {"A": "Approximately 0.406", "B": "Approximately 0.594", "C": "Approximately 0.271", "D": "Approximately 0.865"}, "answer": "B"}, {"id": 87, "question": "A Poisson distribution gives P(r ≥ 3) = 0.80 and P(r ≥ 10) = 0.04. What is the probability of 3 or more but fewer than 10 accidents?", "options": {"A": "0.84", "B": "0.76", "C": "0.04", "D": "0.80"}, "answer": "B"}, {"id": 88, "question": "In year 11 a firm expects M = 4 accidents. From past records, the loss per accident is total loss ÷ total accidents = Br 36,000 ÷ 12 = Br 3,000. What is the expected total annual monetary loss?", "options": {"A": "Br 3,000", "B": "Br 36,000", "C": "Br 12,000", "D": "Br 9,000"}, "answer": "C"}, {"id": 89, "question": "With M = 4, SD of accidents = 2, loss per accident Br 3,000, and expected loss Br 12,000, what are the standard deviation of monetary loss and the risk relative to the mean monetary loss?", "options": {"A": "SD = Br 6,000; RM = 0.50", "B": "SD = Br 12,000; RM = 1.0", "C": "SD = Br 3,000; RM = 0.25", "D": "SD = Br 6,000; RM = 2.0"}, "answer": "A"}, {"id": 90, "question": "With 50 cars exposed and a Poisson SD of 2 accidents, what is the risk relative to the number of exposure units (Rn)?", "options": {"A": "50%", "B": "4%", "C": "25%", "D": "2%"}, "answer": "B"}, {"id": 91, "question": "How does risk financing differ from risk control?", "options": {"A": "Risk financing aims to prevent losses, whereas risk control provides money after losses", "B": "Risk financing applies only to insurable risks, whereas risk control applies only to speculative risks", "C": "They are the same approach under different names", "D": "Risk financing provides money to cover losses after they occur, whereas risk control aims to reduce the likelihood and severity of losses and make them more predictable"}, "answer": "D"}, {"id": 92, "question": "A company decides not to build a factory in a flood-prone area. Which risk control tool is being used?", "options": {"A": "Loss reduction", "B": "Separation", "C": "Retention", "D": "Avoidance"}, "answer": "D"}, {"id": 93, "question": "Which statement correctly explains the main limitation of avoidance?", "options": {"A": "It is often impractical, because businesses must own buildings, vehicles, and machinery to operate, and avoiding every risk could end the business", "B": "It never eliminates the possibility of loss", "C": "It is useful only for risks that cannot be controlled in any other way", "D": "It increases the severity of the losses that remain"}, "answer": "A"}, {"id": 94, "question": "Which classification is correct?", "options": {"A": "A burglar alarm is loss reduction, whereas fire extinguishers are loss prevention", "B": "All safety devices are loss prevention, because they act before the loss", "C": "Fire extinguishers and burglar alarms are both risk financing tools", "D": "A burglar alarm is loss prevention, whereas fire extinguishers and first-aid kits are loss reduction"}, "answer": "D"}, {"id": 95, "question": "A company stores its inventory in several warehouses in different towns instead of one. Which tool is this?", "options": {"A": "Combination", "B": "Separation", "C": "Diversification", "D": "Avoidance"}, "answer": "B"}, {"id": 96, "question": "Match each action with the correct tool: (i) a farmer grows several crops instead of relying on one; (ii) two firms merge to increase the number of exposure units and make losses more predictable; (iii) a firm holds inventory in several warehouses.", "options": {"A": "(i) combination; (ii) separation; (iii) diversification", "B": "(i) separation; (ii) diversification; (iii) combination", "C": "(i) diversification; (ii) separation; (iii) combination", "D": "(i) diversification; (ii) combination (pooling); (iii) separation"}, "answer": "D"}, {"id": 97, "question": "The three main risk financing tools are:", "options": {"A": "retention, non-insurance transfer, and insurance", "B": "avoidance, separation, and diversification", "C": "loss prevention, loss reduction, and combination", "D": "retention, avoidance, and loss reduction"}, "answer": "A"}, {"id": 98, "question": "In which situation is retention most appropriate?", "options": {"A": "Past records allow the firm to predict its losses accurately, and the worst possible loss would not seriously affect its financial position", "B": "The worst possible loss is catastrophic and cannot be predicted", "C": "Losses are rare but extremely costly and unpredictable", "D": "Insurance is available at a low premium and the loss would be large"}, "answer": "A"}, {"id": 99, "question": "Which statement correctly describes retention (self-insurance)?", "options": {"A": "It transfers the financial burden to an insurer and removes the risk of large losses", "B": "It is appropriate mainly for large, unpredictable losses, since it protects against them", "C": "It saves insurance premiums and gives control over claim handling, but the firm bears the entire financial burden, and large unexpected losses may create financial problems", "D": "It is the same as avoidance, because the firm stops the risky activity"}, "answer": "C"}, {"id": 100, "question": "Which classification of non-insurance transfers is correct? (i) selling a building; (ii) a contract under which an event organizer, and not the venue owner, must pay for damage during an event.", "options": {"A": "(i) transfer of the activity or property; (ii) transfer of the probable loss through a contract", "B": "(i) transfer of the probable loss through a contract; (ii) transfer of the activity or property", "C": "(i) insurance; (ii) retention", "D": "(i) avoidance; (ii) separation"}, "answer": "A"}, {"id": 101, "question": "A firm evaluates four exposures: (i) frequent but minor vehicle damage; (ii) rare but very costly factory fire; (iii) frequent and severe losses; (iv) rare and minor losses. Which matching to the selection matrix is correct?", "options": {"A": "(i) insurance; (ii) retention; (iii) avoidance; (iv) retention and reduction", "B": "(i) retention and reduction; (ii) insurance; (iii) avoidance; (iv) retention", "C": "(i) avoidance; (ii) retention and reduction; (iii) insurance; (iv) retention", "D": "(i) retention; (ii) avoidance; (iii) insurance; (iv) retention and reduction"}, "answer": "B"}, {"id": 102, "question": "In an insurance contract, the insured (transferor) is:", "options": {"A": "the insurance company that accepts the risk in exchange for a premium", "B": "the party that pays no premium but receives all protection", "C": "the person or organization that faces the risk and pays a premium to obtain protection", "D": "the regulatory authority that approves the contract"}, "answer": "C"}, {"id": 103, "question": "An insurer insures 5,000 houses, each worth Br 200,000, and on average 3 houses burn each year. If the expected loss is shared equally among policyholders, what premium does each contribute?", "options": {"A": "Br 600", "B": "Br 120", "C": "Br 40", "D": "Br 3,000"}, "answer": "B"}, {"id": 104, "question": "A town has 200 houses, each costing Br 80,000 to rebuild. One house is destroyed by a storm and the cost is shared equally among all 200 families. How much does each family contribute, and which characteristic of insurance does this show?", "options": {"A": "Br 80,000 each; indemnification", "B": "Br 400 each; risk avoidance", "C": "Br 160 each; fortuitous loss", "D": "Br 400 each; pooling (sharing) of losses"}, "answer": "D"}, {"id": 105, "question": "Which statement correctly applies the law of large numbers to insurance?", "options": {"A": "As the group gets larger, the error in predicting losses increases", "B": "The law applies only when losses are deliberately caused", "C": "The law makes the loss of each individual insured predictable", "D": "As the number of exposure units in the group increases, the error in predicting future losses decreases and predicted experience approaches actual loss experience"}, "answer": "D"}, {"id": 106, "question": "A house is destroyed by a covered fire and the insurer compensates the owner according to the policy. What is the purpose of this compensation?", "options": {"A": "To place the insured in a better financial position than before the loss", "B": "To give a free gift, since insurance is a form of charity", "C": "To restore the insured to approximately the same financial position as before the loss", "D": "To transfer ownership of the property to the insurer for the premium paid"}, "answer": "C"}, {"id": 107, "question": "Which statement correctly explains why insurance is not charity, and what risk transfer means?", "options": {"A": "Insurance is charity, because the insurer pays more than it receives; and risk transfer moves responsibility from the insurer to the insured", "B": "Insurance is not charity only because the insurer earns a profit; risk transfer means the insured keeps all financial responsibility", "C": "Insurance is charity when the insured does not suffer a loss; risk transfer is the same as retention", "D": "The insured must pay a premium to receive protection, whereas charity is given freely without expecting payment; and risk transfer moves financial responsibility for a covered pure risk from the insured to the insurer"}, "answer": "D"}, {"id": 108, "question": "A fortuitous loss is best defined as:", "options": {"A": "a loss that happens unexpectedly, accidentally, and by chance, without the insured intentionally causing it", "B": "a loss that the insured deliberately arranges in order to claim compensation", "C": "a loss that is certain to occur at a known time", "D": "a loss that affects everyone in an economy at once"}, "answer": "A"}, {"id": 109, "question": "Which insurer can estimate fire losses more reliably, and why?", "options": {"A": "An insurer covering 100,000 similar houses, because a large number of homogeneous exposure units lets it use the law of large numbers", "B": "An insurer covering only 10 houses, because small groups are easier to analyze", "C": "An insurer covering 10 very different kinds of properties, because variety reduces error", "D": "Both are equally reliable, because group size does not affect prediction"}, "answer": "A"}, {"id": 110, "question": "Among 1,000 insured cars, 20 are damaged in accidents in one case, and in another case 200 owners deliberately damage their cars to claim insurance. Why does the second case make the risk uninsurable?", "options": {"A": "Intentional losses are more predictable, which lowers insurance costs", "B": "Intentional losses create moral hazard and are no longer random, which makes losses unpredictable and raises insurance costs", "C": "Intentional losses improve the operation of the law of large numbers", "D": "Intentional losses are insurable as long as the premium is paid"}, "answer": "B"}, {"id": 111, "question": "An insurer cannot establish when, where, or how much a claimed loss was, so it cannot tell whether the loss falls within the policy period or the covered area. Which requirement of an insurable risk is not met?", "options": {"A": "There must be no catastrophic loss", "B": "The premium must be economically feasible", "C": "The loss must be determinable and calculable in terms of cause, place, time, and amount", "D": "There must be a large number of homogeneous exposure units"}, "answer": "C"}, {"id": 112, "question": "An insurer writes policies only on houses in a single river valley, and a flood threatens almost all of them at once. Which measures can reduce this catastrophic risk?", "options": {"A": "Charging premiums only after losses occur, and insuring only intentional losses", "B": "Concentrating more policies in the valley, and avoiding any reinsurance", "C": "Reinsurance, transferring part of the risk to a reinsurer, and geographical diversification, spreading coverage across different areas", "D": "Insuring only losses whose cause, place, and time are unknown"}, "answer": "C"}, {"id": 113, "question": "For an insurer to set an appropriate premium under the calculable chance of loss requirement, it must estimate average frequency and severity of losses. What must the premium be enough to cover?", "options": {"A": "Only expected claims", "B": "Only the insurer's expenses and profit", "C": "Claims for losses the insured has deliberately caused", "D": "Expected claims, insurance company expenses, and a reasonable profit"}, "answer": "D"}, {"id": 114, "question": "The probability of loss for a particular exposure is extremely high. Why is it unsuitable for private insurance?", "options": {"A": "The premium would be too low for the insurer to remain profitable", "B": "A high probability of loss makes the loss unpredictable by definition", "C": "The insurer would have to charge a very high premium, so the premium would no longer be substantially lower than the potential loss", "D": "Insurance only covers losses with certain outcomes"}, "answer": "C"}, {"id": 115, "question": "A firm wants insurance against a fall in the market price of its shares. Why is this generally difficult to insure privately?", "options": {"A": "It is a personal risk, and personal risks cannot be insured privately", "B": "It is a financial or market risk that is often speculative, may have greater catastrophic potential, and has a loss probability that is hard to determine, making premium calculation difficult", "C": "It is a liability risk with a clearly determinable probability", "D": "It is a property risk, and property risks are insurable only by governments"}, "answer": "B"}, {"id": 116, "question": "Which statement correctly distinguishes insurance from speculation?", "options": {"A": "Insurance aims at profit from price changes, whereas speculation aims at protection against loss", "B": "Insurance deliberately accepts uninsurable risk, whereas speculation transfers it to an insurer", "C": "Both insurance and speculation reduce objective risk through the law of large numbers", "D": "Insurance transfers an insurable risk for protection against loss and can reduce objective risk through the law of large numbers, whereas speculation deliberately accepts risk in the hope of profit from future price changes and does not reduce risk that way"}, "answer": "D"}, {"id": 117, "question": "One man places a bet on a football match while another buys fire insurance for his house. Which analysis is consistent with the unit?", "options": {"A": "Both create new risks in the hope of making a profit", "B": "The bet creates a new risk in the hope of gain, whereas fire insurance transfers an existing risk to protect against loss", "C": "The bet deals with an existing risk, whereas fire insurance creates a new one", "D": "Both transfer an existing risk to a third party for protection"}, "answer": "B"}, {"id": 118, "question": "How does insurance help reduce the cost of capital?", "options": {"A": "Insurers refuse to invest premiums, which keeps interest rates stable", "B": "Insurers pay claims before collecting premiums, which reduces the funds available", "C": "Insurers collect premiums in advance and invest them, increasing the supply of loanable funds, which can lower borrowing costs and encourage economic growth", "D": "Insurance reduces the cost of capital by eliminating all risk"}, "answer": "C"}, {"id": 119, "question": "A shop owner sleeps peacefully because she knows that fire damage to her stock would be compensated. Which importance of insurance does this illustrate?", "options": {"A": "Less worry and fear", "B": "Source of investment funds", "C": "Loss control", "D": "Reduction of the cost of capital"}, "answer": "A"}, {"id": 120, "question": "Why do insurers encourage loss prevention and safety measures even though insurance mainly spreads losses?", "options": {"A": "Because loss prevention eliminates the need for any premiums", "B": "Because if losses increase, insurers pay more claims, their profits may decrease, and premiums may need to rise", "C": "Because insurers are legally required to prevent all losses", "D": "Because higher losses always increase insurers' profits"}, "answer": "B"}], "fm1c1": [{"id": 1, "question": "Finance, as a distinct area of study, is concerned with:", "options": {"A": "the recording and reporting of business transactions to produce statements for external users", "B": "the production and distribution of goods and services within an economy as a whole", "C": "the raising and utilizing of funds by individuals, businesses and governments", "D": "the planning of marketing strategies in order to increase a firm’s market share"}, "answer": "C", "explanation": "Finance is a distinct area of study dealing with the facts, theories, principles, techniques and practices related to raising and utilizing funds (money) by individuals, businesses and governments. [Slides 3–4]"}, {"id": 2, "question": "Which statement correctly describes public finance?", "options": {"A": "It deals with the mobilization or administration of public funds, such as taxes and public borrowing.", "B": "It deals with the mobilization of funds from an individual’s own sources, in cash or non-cash items.", "C": "It deals with the flow of money through banks, insurance companies, pension funds and the markets for financial assets.", "D": "It deals with the acquisition and use of funds by business enterprises in order to attain their desired goals."}, "answer": "A", "explanation": "Public finance concerns the mobilization or administration of public funds, including securing funds from the public through taxes and borrowing from public and foreign markets. The other options describe personal finance, financial markets and institutions, and financial management respectively. [Slides 6–8]"}, {"id": 3, "question": "A student studies how banks, insurance companies and pension funds move money, and how changes in interest rates affect that flow. Which major area of finance is being studied?", "options": {"A": "Financial markets and institutions", "B": "Personal finance (funds from own sources)", "C": "Public finance (taxes and public borrowing)", "D": "International finance (cross-border corporate finance)"}, "answer": "A", "explanation": "Financial markets and institutions focus on the flow of money through institutions such as banks, insurance companies and pension funds, and on the impact of interest rates on that flow. [Slide 7]"}, {"id": 4, "question": "A firm rents its office building instead of owning it. According to the chapter, how should the rented building be viewed in relation to capital?", "options": {"A": "It is not capital, because capital consists only of items that the firm actually owns outright.", "B": "It is capital, because items used but not owned, like rented buildings, are included.", "C": "It is capital only after the firm has bought the building with money borrowed from a bank.", "D": "It is not capital, because buildings are classified as current assets and not as capital."}, "answer": "B", "explanation": "Capital includes items of value that are owned and used (land, buildings, inventories) and items of value that are used but not owned, such as leased or rented buildings. [Slide 8]"}, {"id": 5, "question": "Financial management can be viewed as a subject, a process or a function. Which description presents it as a decision-making process?", "options": {"A": "One major area of study under finance that deals with decisions affecting a firm’s finances", "B": "A specified business function, alongside marketing, production and human resource management", "C": "Planning for raising and utilizing funds in a manner that achieves the goal of the firm", "D": "The study of the institutions, markets and instruments through which money is transferred"}, "answer": "C", "explanation": "Slide 9 describes financial management as “a decision making process concerned with planning for raising, and utilizing funds in a manner that achieves the goal of a firm”. The first distractor presents it as a subject and the second as a business function. [Slides 9–10]"}, {"id": 6, "question": "According to the chapter, the finance manager generally:", "options": {"A": "works under the head of the marketing department as a support officer", "B": "is responsible only for recording transactions in the accounting department", "C": "is limited to negotiating loans with the firm’s external sources of funds", "D": "holds one of the senior-most positions and reports directly to the President"}, "answer": "D", "explanation": "The finance manager generally holds one of the senior-most positions in the company, directly reporting to the President, and is responsible for the cost, finance, accounting and taxation departments, among others. [Slide 13]"}, {"id": 7, "question": "Which statement best describes the traditional approach to financial management?", "options": {"A": "It covered investment, financing and dividend decisions and the efficient allocation of funds within the firm.", "B": "It focused on maximizing the market value of the firm’s shares through both long-term and short-term decisions.", "C": "It was limited to raising external funds and ignored internal decisions such as cash, credit and inventory control.", "D": "It treated the financial manager as a senior executive responsible for all business decisions affecting finance."}, "answer": "C", "explanation": "The traditional approach viewed finance narrowly as the procurement of funds from external sources; internal decisions such as cash and credit management, inventory control and capital budgeting were ignored. The other options describe the modern approach. [Slides 15–16]"}, {"id": 8, "question": "A finance manager spends nearly all of her time negotiating bank loans and issuing securities, and pays no attention to cash management, credit policy, inventory control or capital budgeting. Which approach does her role reflect?", "options": {"A": "The traditional approach to financial management", "B": "The modern approach, covering investing, financing and dividends", "C": "The wealth maximization approach to financial decision making", "D": "The profit maximization approach to financial decision making"}, "answer": "A", "explanation": "Concentrating only on raising funds from external sources while ignoring internal financial decisions is the traditional approach. The modern approach includes both acquiring and efficiently allocating funds. [Slides 15–16]"}, {"id": 9, "question": "Why does the modern approach give the financial manager a broader role than the traditional approach?", "options": {"A": "It restricts the role to dealing with financial institutions and the legal relationships with outside suppliers of funds.", "B": "It treats the manager as an assistant to accountants, who make most investment decisions within the firm.", "C": "It covers all decisions affecting finance (investing, financing, dividends) and both acquiring and allocating funds.", "D": "It shifts attention from the use of funds to the sources of funds, so that internal allocation is left to other managers."}, "answer": "C", "explanation": "The modern approach provides a framework for the investing, financing and dividend policy decisions, and the manager’s role covers both acquiring funds from external sources and allocating them efficiently within the firm. [Slide 16]"}, {"id": 10, "question": "Under the profit maximization approach, which actions should a firm undertake?", "options": {"A": "Only those actions that increase profits", "B": "Only those actions that reduce the risk borne by creditors", "C": "Only those actions that increase the market price of its shares", "D": "Only those actions that increase the firm’s sales or market share"}, "answer": "A", "explanation": "According to this approach, only actions that increase profits should be undertaken. [Slide 19]"}, {"id": 11, "question": "Why is profit maximization not as inclusive a goal as maximizing shareholder value in today’s business environment?", "options": {"A": "Profit maximization applies only to firms financed entirely by their owners’ own funds, a situation that is now very rare in practice.", "B": "Profit maximization can be pursued only by sole proprietorships and never by joint stock companies of any size.", "C": "Profit maximization requires perfect competition, which guarantees that shareholder value will always decline over time.", "D": "Professional managers, separate from owners, must reconcile the conflicting objectives of many interested parties, not only profit."}, "answer": "D", "explanation": "Joint stock companies separated management from ownership; today firms are financed by owners and creditors and run by professional managers, who must reconcile the objectives of customers, employees, government and society. Profit maximization is therefore not as inclusive as maximizing shareholder value. [Slides 20–21]"}, {"id": 12, "question": "Project A earns Br. 5,000, Br. 10,000 and Br. 5,000 in periods 1 to 3, while Project B earns nothing in period 1 and Br. 10,000 in each of periods 2 and 3. Both earn Br. 20,000 in total. Which project does the chapter prefer, and why?", "options": {"A": "Project B, because its larger later cash flows exceed those of Project A", "B": "Project A, because it delivers part of its benefits earlier", "C": "Neither, because both projects earn the same total profit of Br. 20,000", "D": "Project B, because it avoids having a cash flow in the first period"}, "answer": "B", "explanation": "Both projects earn the same total profit, but Project A is preferred because of the quality of its benefits: profit maximization ignores the timing of returns, and earlier benefits are worth more in present value terms. [Slides 23–24]"}, {"id": 13, "question": "Two projects each earn total profits of Br. 3,000. Project A earns Br. 1,000 in recession, normal and boom conditions alike. Project B earns Br. 0 in a recession, Br. 1,000 in normal times and Br. 2,000 in a boom. Which project is preferred, and which flaw of profit maximization does this illustrate?", "options": {"A": "Project B; profit maximization ignores the higher profit available in a boom", "B": "Project A; profit maximization ignores the timing of the returns", "C": "Project B; profit maximization overstates the profit available in a recession", "D": "Project A; profit maximization ignores uncertainty (risk) about expected profits"}, "answer": "D", "explanation": "Project A’s profit is certain while Project B’s depends on the state of the economy, so A is preferred even though total profits are equal. This shows that profit maximization ignores risk (uncertainty about expected profits). [Slides 23, 25]"}, {"id": 14, "question": "A firm could always raise its total profits by issuing stock and investing the proceeds in Treasury Bills. What does this show about profit maximization as a goal?", "options": {"A": "Total profits are the best measure of shareholder wealth, because every increase in profit raises share value.", "B": "Treasury Bills are the most profitable investment, so a firm should issue stock whenever it can.", "C": "Total profits can rise while shareholder wealth declines, so earnings per share matter more than total profits.", "D": "Issuing stock always increases earnings per share, so shareholders benefit whenever total profits increase."}, "answer": "C", "explanation": "Total profits are not as important as earnings per share; a firm could raise total profits by issuing stock and buying Treasury Bills, yet shareholder wealth can decline despite rising profits. [Slide 21]"}, {"id": 15, "question": "How is the net present value (NPV) of a course of action determined?", "options": {"A": "It is the gross present value of its benefits minus the investment required to achieve them.", "B": "It is the total of the undiscounted benefits minus the investment required to achieve them.", "C": "It is the investment required divided by the gross present value of the benefits received.", "D": "It is the gross present value of its benefits plus the investment required to achieve them."}, "answer": "A", "explanation": "The NPV of a course of action is the difference between the gross present value (GPV) of its benefits and the amount of investment required to achieve those benefits. GPV is found by discounting the benefits at a rate reflecting their timing and uncertainty. [Slides 27–28]"}, {"id": 16, "question": "A project requires an initial outlay of Br. 100,000 and is expected to generate cash flows of Br. 60,000 at the end of year 1 and Br. 66,000 at the end of year 2. The appropriate discount rate is 10%. What is the project’s net present wealth (NPV)?", "options": {"A": "Br. −9,091", "B": "Br. 9,091", "C": "Br. 26,000", "D": "Br. 109,091"}, "answer": "B", "explanation": "W = 60,000/1.10 + 66,000/(1.10)² − 100,000 = 54,545 + 54,545 − 100,000 = Br. 9,091. (Br. 109,091 is the gross present value; Br. 26,000 ignores discounting.) [Slides 29–30]"}, {"id": 17, "question": "A proposed action has a gross present value of benefits of Br. 450,000 and requires an investment of Br. 480,000. What should the firm do, according to the NPV decision rule?", "options": {"A": "Accept it, because the benefits of Br. 450,000 are large in absolute terms for any firm", "B": "Accept it, because its NPV is positive at Br. 30,000 for the firm", "C": "Accept it only if its total profits exceed those of other proposals in the budget", "D": "Reject it, because its NPV is negative (Br. −30,000) and it would reduce wealth"}, "answer": "D", "explanation": "NPV = 450,000 − 480,000 = −30,000. A financial action with a negative NPV should be rejected; only a positive NPV creates wealth. [Slide 28]"}, {"id": 18, "question": "In the wealth formula W = A1/(1 + k)¹ + A2/(1 + k)² + … + An/(1 + k)ⁿ − C, what happens to W if the discount rate k rises while the cash flows and C stay the same?", "options": {"A": "W rises, because a higher k increases the weight placed on each future cash flow", "B": "W is unchanged, because k affects only the initial outlay C of the project", "C": "W rises, because a higher k reduces the initial outlay needed to acquire the asset", "D": "W falls, because a higher k reduces the present value of the expected cash flows"}, "answer": "D", "explanation": "k is the discount rate that measures risk and timing. A higher k makes each term A/(1 + k)ᵗ smaller, so the present value of the benefits, and therefore W, falls while C is unchanged. [Slides 29–30]"}, {"id": 19, "question": "Which feature makes wealth maximization a better financial goal than profit maximization?", "options": {"A": "It discounts benefits at a rate that reflects their timing and uncertainty", "B": "It concentrates on the total profit earned in the current accounting period", "C": "It assumes that perfect competition exists in the markets where the firm operates", "D": "It treats gross profit, net profit and earnings as equivalent measures of success"}, "answer": "A", "explanation": "Profit maximization ignores the timing of returns and risk, whereas wealth maximization measures benefits by their present value, discounted at a rate reflecting timing and uncertainty. [Slides 23, 28]"}, {"id": 20, "question": "A manager proposes a decision that will raise this year’s profit but is expected to lower the long-term market price of the firm’s shares. According to the chapter’s criterion, what is the best judgment?", "options": {"A": "It should be taken, because any increase in profit increases shareholder wealth in full", "B": "It should not be taken, because only decisions that raise the long-term market price are good", "C": "It should be taken, because current profit is a more reliable measure than future market price", "D": "It should be taken if the increase in profit exceeds the fall in share price in the first year"}, "answer": "B", "explanation": "A decision that increases the long-term market price of the firm’s stock is good; otherwise the action should not be taken. [Slide 32]"}, {"id": 21, "question": "To maximize wealth, a manager suggests ignoring the cost of reducing pollution and improving safety in the firm’s plants. Which judgment is most consistent with the chapter?", "options": {"A": "Accept it, because wealth maximization is the only responsibility a firm has toward its owners and nobody else.", "B": "Reject it: the firm must not ignore social responsibility, including safe working conditions and avoiding pollution.", "C": "Accept it, because ethical responsibility applies only to firms that are unable to raise their market share.", "D": "Accept it, because avoiding pollution is a cost for society to bear and has no effect on the firm’s value."}, "answer": "B", "explanation": "The firm should in no way ignore social responsibility: it is responsible for the welfare of its employees, customers and communities, including safe working conditions, avoiding pollution of air and water and producing safe products. [Slides 33, 51]"}, {"id": 22, "question": "Which of the following lists the three major decision functions of financial management?", "options": {"A": "Investment, budgeting and forecasting decisions", "B": "Financing, credit and inventory decisions", "C": "Investment, financing and dividend decisions", "D": "Dividend, marketing and production decisions"}, "answer": "C", "explanation": "Slide 34 names three major areas of decision functions: investment, financing and dividend decisions. [Slide 34]"}, {"id": 23, "question": "Which pairing of asset type and decision area is correct?", "options": {"A": "Long-term (fixed) assets – capital budgeting; current assets – working capital management", "B": "Long-term (fixed) assets – working capital management; current assets – capital budgeting", "C": "Long-term (fixed) assets – dividend policy; current assets – capital structure", "D": "Long-term (fixed) assets – capital structure; current assets – dividend policy"}, "answer": "A", "explanation": "The fixed assets decision is called capital budgeting and the current assets decision is called working capital management. [Slide 36]"}, {"id": 24, "question": "A firm is considering buying a major piece of machinery that will operate for many years. Which financial decision area is involved?", "options": {"A": "Working capital management (decision on current assets)", "B": "Capital structure (choice between debt and equity capital)", "C": "Dividend policy (distribution of earnings to the owners)", "D": "Capital budgeting (investment decision on fixed assets)"}, "answer": "D", "explanation": "Capital budgeting is the process of evaluating the purchase of major fixed assets, including buildings, machinery and equipment. [Slides 36–37]"}, {"id": 25, "question": "Why does a conflict exist between profitability and liquidity in working capital management?", "options": {"A": "Current assets earn the highest return of all assets, but they cannot be converted into cash within a year.", "B": "Liquidity requires holding only fixed assets, while profitability requires holding mainly current assets of all types.", "C": "Funds tied up in current assets reduce profitability, but enough current assets are needed for liquidity and production.", "D": "Higher profitability always requires borrowing, while liquidity can be maintained only by issuing new shares of stock."}, "answer": "C", "explanation": "Involvement of funds in current assets reduces profitability, yet current needs must be met to maintain production and avoid liquidity and insolvency dangers; the manager must achieve a proper trade-off. [Slide 40]"}, {"id": 26, "question": "Why is capital budgeting regarded as an especially important financial decision?", "options": {"A": "It deals with day-to-day cash and credit decisions, so errors are corrected quickly and at little cost to the firm.", "B": "It involves short-term investments whose returns are certain, so risk does not need to be evaluated by managers.", "C": "It concerns only the dividend paid to owners, which in turn determines the firm’s capital structure and its taxes.", "D": "Long-lived asset expenditure creates large, permanent commitments affecting the firm’s long-run flexibility and earning power."}, "answer": "D", "explanation": "Most expenditure for long-lived assets affects operations over many years and represents large and permanent commitments that influence long-run flexibility and earning power. [Slide 38]"}, {"id": 27, "question": "What is the purpose of a hurdle rate in capital budgeting?", "options": {"A": "It is the proportion of earnings that a firm pays out to its shareholders as dividends.", "B": "It is the standard against which the expected return of a new investment is assessed.", "C": "It is the rate at which the firm borrows funds from its creditors for working capital.", "D": "It is the percentage of total funds that is raised through equity instead of through debt."}, "answer": "B", "explanation": "A major aspect of capital budgeting is the selection of a standard or hurdle rate against which the expected return of a new investment can be assessed. [Slide 39]"}, {"id": 28, "question": "A firm keeps far more cash, receivables and inventory than its operations need. According to the chapter, what is the most likely result?", "options": {"A": "Scarce funds are used unremuneratively, which reduces profitability", "B": "The smooth flow of business activity is interrupted by a shortage of funds", "C": "The firm becomes more profitable because its liquidity is higher than needed", "D": "The firm’s fixed assets decision is replaced by a capital structure decision"}, "answer": "A", "explanation": "Excessive working capital leads to unremunerative use of scarce funds, and involvement of funds in current assets reduces profitability. Inadequate working capital, not excess, interrupts the smooth flow of business. [Slides 40–41]"}, {"id": 29, "question": "A firm increases the proportion of debt in its financing. Which consequence is described in the chapter?", "options": {"A": "The return on equity increases, but so does the risk borne by shareholders, so a balance must be struck.", "B": "The return on equity falls, while the risk borne by shareholders also falls, so no balance is needed.", "C": "The return on equity is unchanged, because debt affects only the firm’s creditors and not the owners.", "D": "The risk borne by shareholders falls, because creditors share the losses of the business equally."}, "answer": "A", "explanation": "The use of debt capital affects the return and risk of shareholders: the return on equity will increase, but so will the risk, so a proper balance between return and risk must be struck. [Slide 43]"}, {"id": 30, "question": "Management is choosing among alternative financing mixes. Which criterion should guide the choice, according to the chapter?", "options": {"A": "Choose the mix with the highest proportion of debt, since debt always increases the market value per share.", "B": "Choose the mix that maximizes shareholders’ return with minimum risk, thereby maximizing market value per share.", "C": "Choose the mix with the lowest proportion of debt, since this eliminates every risk for shareholders.", "D": "Choose the mix that maximizes current profit regardless of its effect on the return and risk of shareholders."}, "answer": "B", "explanation": "When the shareholders’ return is maximized with minimum risk, the market value per share is maximized and the firm’s capital structure is optimum. [Slides 42–43]"}, {"id": 31, "question": "A firm’s earnings available to shareholders are Br. 800,000 and it pays dividends of Br. 320,000. What is its dividend payout ratio?", "options": {"A": "25%", "B": "40%", "C": "60%", "D": "250%"}, "answer": "B", "explanation": "The payout ratio is the percentage of dividends to earnings available to shareholders: 320,000 ÷ 800,000 = 40%. (60% is the retained portion; 250% inverts the ratio.) [Slide 45]"}, {"id": 32, "question": "What does the dividend decision determine?", "options": {"A": "How much of the firm’s funds are borrowed from creditors and how much is raised from its owners", "B": "Which fixed assets are bought and which current assets are held by the firm at the year end", "C": "How much the firm must hold in cash to meet its short-term obligations as they fall due", "D": "How much of the firm’s funds are reinvested in the business and how much is returned to the owners"}, "answer": "D", "explanation": "The dividend decision sets the policy on how much of the firm’s funds should be reinvested and how much returned to the owners: distribute all profits, retain them, or distribute a portion and retain the balance. [Slide 44]"}, {"id": 33, "question": "Shareholders are not indifferent to a firm’s dividend policy. What should the financial manager do?", "options": {"A": "Determine the optimum payout ratio, the one that maximizes the market value of the firm’s shares.", "B": "Distribute all earnings every year, because retained profits never benefit the shareholders in any way.", "C": "Retain all earnings every year, because dividends reduce the funds available for investment in the business.", "D": "Set the payout ratio at the level paid by competitors, whatever its effect on the value of the firm’s shares."}, "answer": "A", "explanation": "If shareholders are not indifferent to dividend policy, the manager must determine the optimum dividend payout ratio; like debt policy, the optimum policy maximizes the market value of the firm’s shares. [Slides 44–45]"}, {"id": 34, "question": "Which statement best describes the relationship between financial management and economics?", "options": {"A": "Economics is unrelated to finance, because managers deal only with the firm’s internal accounts, records and statements.", "B": "Finance is the “mother science” of economics, because economic theories are derived from corporate decisions made by firms.", "C": "Economics matters only to government finance, not to the financial decisions of business firms in the economy.", "D": "Economics is the “mother science” of finance; managers must understand economic activity, policy, inflation and interest rates."}, "answer": "D", "explanation": "Economics is a sort of “Mother Science” to finance; financial managers must understand the economic framework and consequences of changing economic activity and policy, and variables such as GNP, inflation, interest rates and taxes. [Slide 46]"}, {"id": 35, "question": "A firm reports a high accrual-based profit but has run short of cash. Which characteristic of the financial manager’s approach explains the concern?", "options": {"A": "The financial manager recognizes revenue at the point of sale and expenses when they are incurred.", "B": "The financial manager devotes most attention to the collection and presentation of financial data.", "C": "The financial manager is concerned only with the preparation of the income statement and balance sheet.", "D": "The financial manager places primary emphasis on cash flows, the intake and outgo of cash."}, "answer": "D", "explanation": "Accountants use the accrual method (revenue recognized at the point of sale, expenses when incurred); the financial manager places primary emphasis on cash flows, while still using accrual-based statements. [Slide 48]"}, {"id": 36, "question": "Which comparison correctly contrasts the accountant with the financial manager?", "options": {"A": "The accountant evaluates returns and risks and decides on investments; the financial manager only records the data for others.", "B": "Both devote equal attention to collecting data, and neither ever makes decisions on the basis of that data once collected.", "C": "The accountant mainly collects and presents data; the financial manager evaluates it and decides on the basis of returns and risks.", "D": "The financial manager prepares the statements on the accrual basis; the accountant studies cash flows, returns and risks."}, "answer": "C", "explanation": "The accountant devotes most attention to the collection and presentation of data; the financial manager evaluates the statements, develops additional data and decides based on assessed returns and risks. [Slide 49]"}, {"id": 37, "question": "A finance manager expects taxes and interest rates to rise after a political change and revises the firm’s plans accordingly. Which relationship of financial management does this illustrate?", "options": {"A": "Financial management and accounting", "B": "Financial management and politics", "C": "Financial management and the law", "D": "Financial management and ethics"}, "answer": "B", "explanation": "Political awareness helps the financial manager predict changes in the economic and financial areas of the country, especially increases or decreases in taxes and interest rates. [Slide 50]"}, {"id": 38, "question": "Why does the chapter regard ethical behavior as necessary for achieving the goal of owner wealth maximization?", "options": {"A": "It allows the firm to maximize its profit even when this requires using society’s resources unfairly or wastefully.", "B": "It reduces litigation costs, maintains corporate image, and builds shareholder confidence and stakeholder loyalty.", "C": "It removes the need for creditors and employees to be considered in the firm’s financial decisions.", "D": "It guarantees that managers never have goals that differ from those of the firm’s shareholders."}, "answer": "B", "explanation": "Ethical practice reduces potential litigation and judgment costs, maintains a positive corporate image, builds shareholders’ confidence and gains the loyalty and respect of stakeholders; it is therefore viewed as necessary for owner wealth maximization. [Slides 51–52]"}, {"id": 39, "question": "An agency relationship exists when:", "options": {"A": "two or more firms agree to merge their operations under a single management team", "B": "a government agency regulates the financial dealings of business firms and institutions", "C": "one or more persons (principals) employ one or more others (agents) to perform some tasks", "D": "one firm acquires another over the opposition of the other firm’s management"}, "answer": "C", "explanation": "An agency relationship exists when one or more persons (principals) employ one or more other persons (agents) to perform some tasks. [Slide 53]"}, {"id": 40, "question": "Why does an agency problem arise between shareholders and managers when a manager owns less than 100 percent of the company?", "options": {"A": "Managers who own part of the firm always prefer lower salaries, and this reduces the wealth of the other shareholders.", "B": "Shareholders who own less than 100 percent of the firm cannot receive any dividends from the managers of the firm.", "C": "Ownership is separated from management, so managers may pursue their own benefit, e.g. working less eagerly or raising pay.", "D": "Creditors take control of the managers’ decisions whenever ownership is shared among several outside investors in a firm."}, "answer": "C", "explanation": "Because of the separation between managers and owners, managers may make decisions not in line with maximizing stockholder wealth, such as working less eagerly and benefiting themselves in salary and bonus. [Slide 53]"}, {"id": 41, "question": "The managers of a company buy luxurious cars it does not need and furnish their offices unnecessarily. How are these costs classified?", "options": {"A": "Indirect agency costs arising from lost opportunities", "B": "Direct agency costs arising from the agency problem", "C": "Costs of financial distress and of bankruptcy proceedings", "D": "Costs of raising additional external funds from investors"}, "answer": "B", "explanation": "Purchase of luxurious and unneeded cars and unnecessarily furnished offices are examples of direct agency costs. Indirect agency costs arise, for example, from avoiding beneficial but riskier projects. [Slide 54]"}, {"id": 42, "question": "A company gives its executives shares of stock based on performance measured by earnings per share, return on assets and return on equity. Which mechanism for reducing conflict between managers and owners is this?", "options": {"A": "Stock options, the option to buy stock at a bargain price", "B": "Performance shares, a type of attractive incentive", "C": "A proxy fight to replace the existing board of directors", "D": "A hostile takeover of the firm over the opposition of management"}, "answer": "B", "explanation": "Performance shares are shares of stock given to executives on the basis of performance measured by EPS, return on assets, return on equity and similar measures; stock options are a separate incentive, and proxy fights and takeovers are threats. [Slide 55]"}, {"id": 43, "question": "Dissatisfied shareholders obtain the authority to vote other shareholders’ stock in order to replace the existing board and management. This mechanism is called:", "options": {"A": "a hostile takeover of the firm", "B": "a stock option plan for executives", "C": "a performance share plan for executives", "D": "a proxy fight against management"}, "answer": "D", "explanation": "A proxy is the authority to vote someone else’s stock; a proxy fight is the mechanism by which unhappy stockholders replace the existing board and thereby the management. [Slide 56]"}, {"id": 44, "question": "Why does the threat of a hostile takeover motivate managers to maximize the stock price?", "options": {"A": "Takeovers occur when the stock price is already maximized, so managers must keep paying higher dividends.", "B": "Takeovers need the consent of the existing managers, who are rewarded with higher salaries for agreeing.", "C": "Takeovers eliminate the creditors’ claims, so managers no longer need to avoid risky projects of any kind.", "D": "Takeovers occur when a stock is undervalued, and the acquired firm’s managers are fired and lose their benefits."}, "answer": "D", "explanation": "A hostile takeover occurs when the firm’s stock is undervalued relative to its potential; the managers of the acquired firm are fired and lose their prior benefits, so they have strong incentives to maximize the stock price. [Slide 56]"}, {"id": 45, "question": "Which management action would most likely create a conflict between creditors and shareholders?", "options": {"A": "Taking on projects riskier than creditors expected and raising debt above the expected level", "B": "Repaying part of the debt early, which raises the value of the creditors’ claims on the firm’s assets and income", "C": "Investing in low-risk projects that match the level of risk that creditors originally expected when they lent funds", "D": "Keeping the debt level and project risk as creditors anticipated when they lent the funds to the firm"}, "answer": "A", "explanation": "Conflicts develop if managers, acting for shareholders, take on projects with greater risk than creditors anticipated and raise the debt level higher than expected; these actions tend to reduce the value of the debt outstanding. [Slide 57]"}, {"id": 46, "question": "Project P requires an outlay of Br. 200,000 and returns Br. 80,000, Br. 100,000 and Br. 120,000 at the end of years 1, 2 and 3. Project Q requires the same outlay and returns Br. 120,000, Br. 100,000 and Br. 80,000 in the same years. Using a 10% discount rate, which statement is correct?", "options": {"A": "P has the higher NPV, by about Br. 6,312, because its larger cash flows come later", "B": "P and Q have equal NPVs, because both return a total of Br. 300,000 in cash", "C": "Q has the higher NPV, by about Br. 51,841, because its NPV exceeds P’s by that amount", "D": "Q has the higher NPV, by about Br. 6,312, because its larger cash flows come earlier"}, "answer": "D", "explanation": "NPV(P) = 72,727 + 82,645 + 90,157 − 200,000 = Br. 45,529; NPV(Q) = 109,091 + 82,645 + 60,105 − 200,000 = Br. 51,841. Q exceeds P by about Br. 6,312 because earlier cash flows are discounted less, even though total cash returns are equal. [Slides 24, 27–30]"}, {"id": 47, "question": "A firm accepts only actions with a positive NPV. Project X has a gross present value of benefits of Br. 520,000 and requires Br. 500,000; Project Y has Br. 610,000 and requires Br. 640,000; Project Z has Br. 300,000 and requires Br. 250,000. Which projects should be accepted, and how much wealth do they create?", "options": {"A": "X, Y and Z, creating Br. 40,000 of wealth", "B": "Z only, creating Br. 50,000 of wealth", "C": "X and Z, creating Br. 70,000 of wealth", "D": "Y and Z, creating Br. 20,000 of wealth"}, "answer": "C", "explanation": "NPV(X) = +20,000, NPV(Y) = −30,000, NPV(Z) = +50,000. Y has a negative NPV and is rejected; X and Z together create 20,000 + 50,000 = Br. 70,000 of wealth. [Slides 27–28]"}, {"id": 48, "question": "A firm’s earnings available to shareholders are Br. 1,200,000 and its dividend payout ratio is 35%. It plans to fund a Br. 1,000,000 investment first from retained earnings. How much must it raise from other sources?", "options": {"A": "Br. 220,000", "B": "Br. 420,000", "C": "Br. 580,000", "D": "Br. 1,000,000"}, "answer": "A", "explanation": "Dividends = 35% × 1,200,000 = 420,000, so retained earnings = 1,200,000 − 420,000 = 780,000. External funds needed = 1,000,000 − 780,000 = Br. 220,000. (Br. 580,000 wrongly deducts the dividends.) [Slides 42, 44–45]"}, {"id": 49, "question": "The managers of a firm reject a project that needs an investment of Br. 300,000 and has a gross present value of benefits of Br. 345,000, solely because it is riskier than their usual projects. Shareholders would have accepted it. How should the loss be described?", "options": {"A": "A direct agency cost, as the Br. 300,000 outlay is wasted on perquisites", "B": "An indirect agency cost, as shareholder wealth of Br. 345,000 is forgone", "C": "An indirect agency cost, as shareholder wealth of Br. 45,000 is forgone", "D": "A direct agency cost, as the Br. 45,000 is paid out to managers as a bonus"}, "answer": "C", "explanation": "NPV = 345,000 − 300,000 = Br. 45,000 of wealth forgone. Avoiding beneficial projects that involve greater risk (lost opportunities) is an indirect agency cost. [Slides 27–28, 54]"}, {"id": 50, "question": "A project requires an outlay of Br. 170,000 and returns Br. 100,000 at the end of each of years 1 and 2. Management’s discount rate is 8% if the project is treated as low-risk and 14% if it is treated as high-risk. What is the correct decision?", "options": {"A": "Accept at 8% (NPV about Br. 8,326) but reject at 14% (NPV about Br. −5,334)", "B": "Accept at both rates, because the total inflows of Br. 200,000 exceed the outlay", "C": "Reject at 8% but accept at 14%, because a higher rate increases the present value", "D": "Reject at both rates, because discounting always makes the NPV negative"}, "answer": "A", "explanation": "At 8%: 100,000/1.08 + 100,000/1.1664 − 170,000 = 92,593 + 85,734 − 170,000 = +8,326 (accept). At 14%: 87,719 + 76,947 − 170,000 = −5,334 (reject). A higher k, reflecting greater risk, lowers the present value of the benefits. [Slides 28–30]"}], "fm1c2": [{"id": 1, "question": "Which financial statement is used to communicate the financial position or condition of a business?", "options": {"A": "Balance sheet", "B": "Income statement", "C": "Cash flow statement", "D": "Statement of changes in owner’s equity"}, "answer": "A", "explanation": "The balance sheet communicates the financial position or condition of a business; the income statement reports operating results and the cash flow statement reports cash receipts and payments."}, {"id": 2, "question": "Which description best fits an income statement?", "options": {"A": "It summarizes the cash receipts and payments of the firm during a specific period of time.", "B": "It reports the total value of the firm’s assets, debt and equity at a particular date.", "C": "It shows the operating results of the firm through flows of revenue and expenses.", "D": "It explains how retained earnings are employed in the business during the period."}, "answer": "C", "explanation": "The income statement shows operating results (revenue and expense flows) and gives a better measure of operating performance and profitability. The other options describe the cash flow statement, balance sheet and statement of changes in owner’s equity."}, {"id": 3, "question": "Which statement is also called the statement of retained earnings and, according to the chapter, is nowadays rarely prepared as a separate statement?", "options": {"A": "Statement of cash receipts and payments", "B": "Statement of operating results", "C": "Statement of financial position", "D": "Statement of changes in owner’s equity"}, "answer": "D", "explanation": "Slide 6 states that the statement of changes in owner’s equity is also called the statement of retained earnings and that a separate statement is no longer popular."}, {"id": 4, "question": "According to the chapter, financial analysis is the assessment of a firm’s:", "options": {"A": "past financial performance as reported in its published statements only.", "B": "past, present and anticipated (projected) future financial condition.", "C": "current liquidity and solvency position at the balance sheet date.", "D": "projected sales, asset needs and financing requirements for the next period."}, "answer": "B", "explanation": "Slide 7 defines financial analysis as the assessment of the firm’s past, present and anticipated (projected) future financial condition."}, {"id": 5, "question": "Which statement correctly distinguishes external analysis from internal analysis?", "options": {"A": "External analysis is carried out by management to evaluate each department and unit, while internal analysis relies mainly on the published statements of the firm.", "B": "External analysis gives more detailed information than internal analysis because outsiders can compare data from several competing firms in the industry.", "C": "Both types are carried out by outsiders, but external analysis relies on ratios while internal analysis relies only on trend percentages.", "D": "External analysis is done by outsiders using published statements and yields limited information; internal analysis uses the firm’s own data to assess its units."}, "answer": "D", "explanation": "Outsiders such as investors and creditors use published statements and obtain only limited information (external); internal analysis is done by those with access to the company’s data to understand the performance of each department and unit."}, {"id": 6, "question": "A commercial bank officer evaluates a loan applicant using only the financial statements that the company has published. This is an example of:", "options": {"A": "external analysis.", "B": "internal analysis.", "C": "trend (horizontal) analysis.", "D": "common-size analysis."}, "answer": "A", "explanation": "Credit agencies and other outsiders who rely on published statements perform external analysis. Trend and common-size analysis are techniques, not types of analysis by user."}, {"id": 7, "question": "Which of the following lists the four techniques of financial statement analysis described in the chapter?", "options": {"A": "Comparative statement, trend (horizontal), break-even (cost-volume-profit) and ratio analysis", "B": "Trend (horizontal), common-size (vertical), ratio and cash-flow analysis", "C": "Comparative statement, trend (horizontal), common-size (vertical) and ratio analysis", "D": "Comparative statement, common-size (vertical), ratio and sensitivity analysis"}, "answer": "C", "explanation": "Slide 11 lists comparative statement analysis, trend (horizontal) analysis, common-size (vertical) analysis and ratio analysis."}, {"id": 8, "question": "What is the main purpose of presenting financial statements in comparative form?", "options": {"A": "To give a time perspective by placing the figures of two or more periods side by side", "B": "To express every item as a percentage of one base figure such as total assets or net sales", "C": "To relate items from different statements through mathematical ratios", "D": "To project the firm’s future financing needs from forecast sales"}, "answer": "A", "explanation": "Comparative statements provide a time perspective by placing figures for two or more periods side by side. The other options describe vertical analysis, ratio analysis and financial forecasting."}, {"id": 9, "question": "In a trend analysis, a firm uses 2019 as the base year (taken as 100). Its sales were Br. 400,000 in 2019 and Br. 500,000 in 2021. What is the trend percentage for 2021?", "options": {"A": "25%", "B": "80%", "C": "100%", "D": "125%"}, "answer": "D", "explanation": "Base-year item = 100, so the 2021 index = 500,000 ÷ 400,000 × 100 = 125%. (25% is the percentage change, not the index.)"}, {"id": 10, "question": "Using Exhibit 2-1, Biftu’s total assets rose from Br. 4,414.6 million in 2011 to Br. 5,050.0 million in 2012. What is the percentage increase?", "options": {"A": "7.0%", "B": "12.6%", "C": "14.4%", "D": "114.4%"}, "answer": "C", "explanation": "Dollar change = 5,050.0 − 4,414.6 = 635.4; % change = 635.4 ÷ 4,414.6 × 100 = 14.4% (prior-year balance is the base)."}, {"id": 11, "question": "Which pair correctly states the bases used in common-size (vertical) analysis?", "options": {"A": "Income statement: net income (100%); balance sheet: total equity (100%)", "B": "Income statement: gross profit (100%); balance sheet: current assets (100%)", "C": "Income statement: total expenses (100%); balance sheet: total liabilities (100%)", "D": "Income statement: net sales (100%); balance sheet: total assets (100%)"}, "answer": "D", "explanation": "For the income statement the base is total revenue (net sales); for the balance sheet it is total assets (and total liabilities and stockholders’ equity on the other side)."}, {"id": 12, "question": "In Biftu’s vertical analysis of the 2012 balance sheet, current liabilities are Br. 2,199.0 million and total assets are Br. 5,050.0 million. Current liabilities as a percentage of total assets are:", "options": {"A": "30.3%", "B": "43.5%", "C": "58.0%", "D": "74.6%"}, "answer": "B", "explanation": "2,199.0 ÷ 5,050.0 × 100 = 43.5%. (30.3% is current assets, 58.0% plant assets and 74.6% total liabilities in the exhibit.)"}, {"id": 13, "question": "In Exhibit 2-2, Biftu’s net sales fell by 4.7% (Br. 7,003.7m to Br. 6,676.6m), yet net income rose by 8.3% (Br. 490.3m to Br. 531.0m). Which item in the exhibit best explains this?", "options": {"A": "Nonrecurring charges fell by Br. 285.7 million (67.7%), so income from operations rose by 14.5%.", "B": "Interest expense decreased by 4.8% from 2011, which more than offset the decline in net sales.", "C": "Income tax expense declined by 7.6% from 2011, which raised the net income of the year considerably.", "D": "Cost of goods sold rose faster than net sales, which widened the gross profit."}, "answer": "A", "explanation": "Nonrecurring charges dropped by Br. 285.7m (−67.7%), lifting income from operations by 14.5%. Interest expense (+4.8%) and tax expense (+7.6%) increased, and cost of goods sold fell by 1.7% while gross profit fell by 7.1%."}, {"id": 14, "question": "Which conclusion is supported by Biftu’s vertical (common-size) income statement for 2011 and 2012?", "options": {"A": "Selling and administrative expenses took a smaller share of net sales in 2012 than in 2011, raising operating income.", "B": "Net income was a smaller share of net sales in 2012 than it was in 2011, despite lower nonrecurring charges.", "C": "Cost of goods sold took a larger share of each sales birr in 2012 (46.8% vs 45.4%), lowering gross profit to 53.2%.", "D": "Income tax expense took a smaller share of net sales in 2012 than in 2011, which raised net income."}, "answer": "C", "explanation": "Cost of goods sold rose from 45.4% to 46.8% of sales while gross profit fell from 54.6% to 53.2%. Selling and administrative expenses (36.6% to 36.8%), net income (7.0% to 8.0%) and tax (4.4% to 4.9%) all moved the other way from the distractors."}, {"id": 15, "question": "How does ratio analysis differ from horizontal and vertical analysis?", "options": {"A": "It compares the same item across periods only, expressing each year relative to a chosen base year figure.", "B": "It expresses each item as a percentage of one significant base figure within the same financial statement, such as total assets.", "C": "It places the figures of two or more periods side by side without any further computation or ratios.", "D": "It compares figures from different categories, such as items taken from the balance sheet and the income statement."}, "answer": "D", "explanation": "Horizontal and vertical analysis compare one figure with another within the same category; ratio analysis relates figures from different categories (e.g. balance sheet and income statement)."}, {"id": 16, "question": "Why does the chapter describe both inadequate and excess liquidity as undesirable?", "options": {"A": "Inadequate liquidity risks failing to meet short-term obligations, while excess liquidity ties up too much in current assets.", "B": "Inadequate liquidity increases working capital, while excess liquidity reduces the firm’s long-term borrowing capacity at banks.", "C": "Excess liquidity is penalized by creditors, while inadequate liquidity is penalized only by shareholders of the firm.", "D": "Both reduce sales growth because current assets and current liabilities must always be equal."}, "answer": "A", "explanation": "A firm must avoid lack of liquidity and also excess liquidity (an excessive investment in current assets) and strike a proper balance between them."}, {"id": 17, "question": "A firm has current assets of Br. 900,000, of which inventory is Br. 300,000. Its current liabilities are Br. 600,000. What is its current ratio?", "options": {"A": "0.67", "B": "1.00", "C": "1.50", "D": "2.00"}, "answer": "C", "explanation": "Current ratio = current assets ÷ current liabilities = 900,000 ÷ 600,000 = 1.50. (1.00 would exclude inventory; 0.67 inverts the ratio.)"}, {"id": 18, "question": "A firm has current assets of Br. 1,000,000, inventory of Br. 400,000, prepayments of Br. 100,000 and current liabilities of Br. 500,000. What is its quick (acid-test) ratio?", "options": {"A": "0.80", "B": "1.00", "C": "1.20", "D": "2.00"}, "answer": "B", "explanation": "Quick ratio = (CA − Inventory − Prepayments) ÷ CL = (1,000,000 − 400,000 − 100,000) ÷ 500,000 = 1.00. Omitting prepayments gives 1.20; the current ratio is 2.00."}, {"id": 19, "question": "Which set gives the conventional benchmarks stated in the chapter for the current ratio, the quick ratio and the cash ratio, respectively?", "options": {"A": "1:1, 2:1 and 0.5:1 or higher", "B": "2:1, 0.5:1 and 1:1 or higher", "C": "1:1, 0.5:1 and 2:1 or higher", "D": "2:1, 1:1 and 0.5:1 or higher"}, "answer": "D", "explanation": "The chapter treats 2:1 as satisfactory for the current ratio (merchandising firms), 1:1 for the quick ratio and 0.5:1 or higher as preferred for the cash ratio."}, {"id": 20, "question": "Biftu’s 2012 current ratio is 0.695 and its quick ratio is 0.309. Which judgment is best supported by the chapter?", "options": {"A": "Liquidity is sound, because both ratios are positive and inventory is only Br. 600 million of the Br. 1,528.6 million of current assets.", "B": "Liquidity is weak: about 70 cents of current assets and 31 cents of fast assets back each birr of current liabilities.", "C": "Liquidity is excessive, because both ratios are below the conventional benchmarks, which signals idle cash and other current assets.", "D": "Liquidity cannot be judged, because the current ratio is a test of quality while the quick ratio is only a test of quantity."}, "answer": "B", "explanation": "The chapter concludes that Biftu is not in good posture in terms of liquidity: 0.695 and 0.309 are well below the conventional 2:1 and 1:1. Higher ratios, not lower, signal stronger liquidity, and the current ratio is a test of quantity, not quality."}, {"id": 21, "question": "A firm reports sales of Br. 3,000,000, cost of goods sold of Br. 2,400,000 and average inventory of Br. 400,000. What is its inventory turnover ratio?", "options": {"A": "0.13", "B": "0.17", "C": "6.0", "D": "7.5"}, "answer": "C", "explanation": "Inventory turnover = cost of goods sold ÷ average inventory = 2,400,000 ÷ 400,000 = 6.0 times. Using sales would give 7.5."}, {"id": 22, "question": "A firm’s inventory turnover has fallen sharply while its sales have remained stable. According to the chapter, what is the most reasonable interpretation?", "options": {"A": "Stock is being converted into sales more quickly, which signals tighter control over purchasing and better liquidity.", "B": "Customers are paying their credit accounts more slowly, which lengthens the average collection period.", "C": "The firm is using more debt than equity to finance its inventory purchases and other current assets.", "D": "It may signal inefficiency such as overstocking or obsolete stock, although it may also reflect a planned build-up."}, "answer": "D", "explanation": "A low inventory turnover signals inefficiency (poor sales or excess inventory), possible overstocking and obsolescence, or a planned build-up. Faster conversion of stock is the sign of a high ratio."}, {"id": 23, "question": "Why is the receivables turnover ratio computed using net credit sales rather than total sales?", "options": {"A": "Cash sales do not create receivables, so including them would distort the ratio and reduce its significance.", "B": "Credit sales are always larger than cash sales, which makes the ratio more stable from year to year in any firm.", "C": "Cash sales are recorded only after receivables are collected, so they would be counted twice.", "D": "Total sales would remove the effect of seasonality that average receivables are meant to capture."}, "answer": "A", "explanation": "The ratio considers only net credit sales and loses its significance if cash sales are included."}, {"id": 24, "question": "A firm has annual credit sales of Br. 3,600,000 and accounts receivable of Br. 450,000. Using a 360-day year, what is its average collection period?", "options": {"A": "8 days", "B": "45 days", "C": "90 days", "D": "360 days"}, "answer": "B", "explanation": "Average credit sales per day = 3,600,000 ÷ 360 = 10,000; average collection period = 450,000 ÷ 10,000 = 45 days."}, {"id": 25, "question": "A firm sells on terms of net 30 days and its average collection period is 52 days. Which judgment is best supported by the chapter?", "options": {"A": "Collection is efficient, because an average collection period above the credit terms shows strong receivables management and sales growth.", "B": "Collection is acceptable, because the excess over credit terms of about three weeks is within the tolerated 10–15 days.", "C": "Collection is too slow: 22 days above the credit terms exceeds the 10–15 day tolerance and suggests weak credit policies.", "D": "No judgment is possible without knowing the firm’s inventory turnover ratio for the same year."}, "answer": "C", "explanation": "The average collection period should be the same as or lower than credit terms and should not exceed them by more than 10–15 days; 52 − 30 = 22 days is too long."}, {"id": 26, "question": "A firm has sales of Br. 5,400,000, fixed assets of Br. 1,800,000 and total assets of Br. 4,500,000. What is its fixed assets turnover?", "options": {"A": "0.33", "B": "0.83", "C": "1.20", "D": "3.00"}, "answer": "D", "explanation": "Fixed assets turnover = sales ÷ fixed assets = 5,400,000 ÷ 1,800,000 = 3.00 times. (1.20 is total assets turnover.)"}, {"id": 27, "question": "Biftu’s 2012 sales were Br. 6,676.6 million. Its fixed assets turnover is 2.28 times, while its total assets turnover is only 1.32 times. What best explains the difference?", "options": {"A": "Total assets of Br. 5,050 million are much larger than fixed assets of Br. 2,932.9 million, while both use the same sales.", "B": "Total assets turnover uses cost of goods sold in the numerator, which is much smaller than the sales figure used for fixed assets.", "C": "Fixed assets turnover is based on credit sales, whereas total assets turnover uses total sales of the year.", "D": "Total assets turnover deducts current liabilities from total assets before dividing th
