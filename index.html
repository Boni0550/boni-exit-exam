<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exit Exam Interactive Quiz</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><h1>Exit Exam Interactive Quiz</h1><p>Choose a course and test your knowledge</p></header>
<div class="container">
<div id="home">
<h2>Select Your Course</h2>
<div class="course-grid">
<div class="card"><h2>Business Ethics</h2><p>100 Multiple Choice Questions</p><button onclick="startQuiz('business')">Start Business Ethics</button></div>
<div class="card"><h2>Risk Management & Insurance</h2><p>120 Multiple Choice Questions</p><button onclick="startQuiz('risk')">Start Risk Management</button></div>
</div></div>

<div id="quiz" class="hidden">
<div class="quiz-card">
<div class="topline"><strong id="courseTitle"></strong><span id="counter"></span><span id="timer" class="timer">Time: 00:00</span></div>
<div class="progress"><div id="bar" class="bar"></div></div>
<div class="nav-title">Jump to question:</div>
<div id="navGrid" class="nav-grid"></div>
<div class="nav-legend"><span><i style="background:#2a9d8f"></i>Answered</span><span><i style="background:#e9edf1"></i>Not answered</span><span><i style="border:2px solid #173f5f"></i>Current</span></div>
<h2 id="question"></h2><div id="options"></div>
<div class="topline"><button id="prevBtn" onclick="previousQuestion()">Previous</button><button class="submit-early" onclick="submitEarly()">Submit Now</button><button id="nextBtn" onclick="nextQuestion()">Next</button></div>
</div></div>

<div id="result" class="hidden result">
<h2>Quiz Result</h2><h1 id="score"></h1><p id="message"></p>
<button onclick="reviewAnswers()">Review Answers</button> <button onclick="goHome()">Choose Another Course</button>
<div id="review" class="hidden"></div>
</div>
</div>
<script src="data/questions.js"></script>
<script src="js/app.js"></script>
</body></html>
