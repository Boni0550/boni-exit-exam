<script>
const quizzes = {"business": [{"id": 1, "question": "Which of the following best defines ethics?", "options": {"A": "A set of laws enacted and enforced by government to regulate business", "B": "Principles, standards, and values that guide people in determining what is right or wrong, fair or unfair, and acceptable or unacceptable behavior", "C": "The pursuit of maximum profit within the limits of organizational policy", "D": "The financial rules used to measure organizational performance"}, "answer": "B"}, {"id": 2, "question": "Business ethics is best described as:", "options": {"A": "the study of how businesses maximize profit for owners", "B": "the set of legal rules governing company registration and taxation", "C": "the application of ethical principles and standards to business decisions, activities, and relationships", "D": "the voluntary donation of business resources to charity"}, "answer": "C"}, {"id": 3, "question": "Which of the following is NOT one of the four dimensions of CSR discussed in the chapter?", "options": {"A": "Economic responsibility", "B": "Legal responsibility", "C": "Philanthropic/community responsibility", "D": "Political responsibility"}, "answer": "D"}, {"id": 4, "question": "Corporate citizenship refers to:", "options": {"A": "the role and responsibilities of a business as a member of society", "B": "the legal nationality of a company's owners", "C": "the right of a company to receive government incentives", "D": "the number of citizens employed by a company"}, "answer": "A"}, {"id": 5, "question": "Sustainability, as discussed in the chapter, means:", "options": {"A": "maximizing present profit to guarantee future dividends", "B": "meeting present needs while considering the ability of future generations to meet their needs", "C": "reducing production to the lowest possible level", "D": "relying exclusively on charitable activities to benefit society"}, "answer": "B"}, {"id": 6, "question": "A company pays its workers the legal minimum wage but requires them to work in unsafe conditions. Which analysis is most consistent with the chapter?", "options": {"A": "The company is fully responsible because its wages comply with the law", "B": "The matter is purely financial and has no ethical dimension", "C": "The company may meet some legal requirements, but the unsafe conditions raise an ethical question about employee welfare", "D": "The issue concerns only philanthropy and not employee welfare"}, "answer": "C"}, {"id": 7, "question": "Which of the following examples reflects CSR's broader focus on social and environmental impacts, rather than a specific decision about ethical conduct?", "options": {"A": "Refusing to offer a bribe to a government official", "B": "Ensuring that advertising messages are truthful", "C": "Reducing environmental pollution through a company-wide waste-treatment program", "D": "Declining a gift from a supplier to avoid a conflict of interest"}, "answer": "C"}, {"id": 8, "question": "Which statement best explains the relationship between business ethics and CSR?", "options": {"A": "Business ethics provides a foundation for responsible behavior, while CSR involves the broader responsibility to consider social, environmental, and economic impacts", "B": "They are identical concepts and can be used interchangeably", "C": "CSR concerns only legal compliance, whereas ethics concerns only profit", "D": "Business ethics is broader than CSR and includes all community programs"}, "answer": "A"}, {"id": 9, "question": "A company donates generously to a local school but continues to discharge untreated waste into a river used by the surrounding community. Which conclusion is most consistent with the chapter?", "options": {"A": "Donations alone fulfill the company's CSR obligations to the community", "B": "Environmental harm is a legal matter only and lies outside CSR", "C": "The donation shows proactive social responsiveness regardless of the pollution", "D": "CSR should not be understood only as charitable donations; responsible conduct also includes how the organization performs its core business activities"}, "answer": "D"}, {"id": 10, "question": "Which statement best distinguishes social responsiveness from CSR?", "options": {"A": "Social responsiveness describes legal duties, whereas CSR describes voluntary donations", "B": "CSR describes responsibilities and commitments, whereas social responsiveness emphasizes how actively an organization responds to changing social expectations and problems", "C": "CSR measures actual outcomes, whereas social responsiveness measures only profit", "D": "They differ only in that responsiveness applies exclusively to small firms"}, "answer": "B"}, {"id": 11, "question": "After public criticism of its labor practices, a firm issues statements aimed mainly at protecting its image while changing little in practice. Which approach to social responsiveness does this illustrate?", "options": {"A": "Defensive approach", "B": "Proactive approach", "C": "Accommodative approach", "D": "Reactive approach"}, "answer": "A"}, {"id": 12, "question": "A company identifies future environmental risks and changes its production system before regulations require it. This is an example of which approach?", "options": {"A": "The reactive approach", "B": "The defensive approach", "C": "The accommodative approach", "D": "The proactive approach"}, "answer": "D"}, {"id": 13, "question": "Which of the following is an indicator of customer performance when measuring social performance?", "options": {"A": "Employee turnover", "B": "Water use", "C": "Protection of customer information", "D": "Local procurement"}, "answer": "C"}, {"id": 14, "question": "Which sequence correctly represents the process linking social expectations, CSR, responsiveness, and performance?", "options": {"A": "CSR actions and programs → social expectations → social performance → CSR commitments → responsiveness → outcomes", "B": "Social expectations and stakeholder concerns → CSR commitments → social responsiveness → CSR actions and programs → outcomes → social performance", "C": "Social performance → CSR commitments → social responsiveness → stakeholder concerns → outcomes → CSR actions", "D": "CSR commitments → outcomes → social expectations → responsiveness → programs → social performance"}, "answer": "B"}, {"id": 15, "question": "Which list consists entirely of negative effects of business activity on communities?", "options": {"A": "Pollution, resource depletion, and displacement of communities", "B": "Employment creation, tax revenue, and skills development", "C": "Local procurement, innovation, and infrastructure development", "D": "Pollution, tax revenue, and community investment"}, "answer": "A"}, {"id": 16, "question": "Which of the following is an example of ethical responsibility, as opposed to legal responsibility?", "options": {"A": "Paying taxes in accordance with tax regulations", "B": "Complying with occupational health and safety requirements", "C": "Avoiding exploitation of suppliers even where the law does not specifically require it", "D": "Meeting the requirements of consumer protection laws"}, "answer": "C"}, {"id": 17, "question": "A firm publishes an impressive CSR policy, yet over the year community complaints rise, emissions increase, and safety incidents grow. What does this situation demonstrate?", "options": {"A": "The firm has achieved strong social performance because it has a policy", "B": "Social performance can be judged only by financial results", "C": "Social performance and CSR commitments are unrelated concepts", "D": "CSR policies alone do not demonstrate good social performance; actual outcomes must be examined"}, "answer": "D"}, {"id": 18, "question": "Which statement about economic responsibility is consistent with the chapter?", "options": {"A": "It includes producing useful goods and services, managing resources efficiently, creating employment, and maintaining long-term financial sustainability", "B": "It requires maximizing profit even at the expense of other stakeholders", "C": "It is irrelevant to CSR because CSR concerns only non-financial matters", "D": "It means providing donations to community projects"}, "answer": "A"}, {"id": 19, "question": "A manufacturer fully complies with all labor, tax, and environmental laws, yet runs advertisements that are legal but deliberately misleading. Which dimension of CSR is the firm failing to meet?", "options": {"A": "Legal responsibility", "B": "Ethical responsibility", "C": "Economic responsibility", "D": "Philanthropic responsibility"}, "answer": "B"}, {"id": 20, "question": "A company cuts costs by dumping waste cheaply, raising short-term profit but creating long-term environmental damage. Which importance of business ethics is most directly ignored?", "options": {"A": "Supporting employee commitment through fair pay", "B": "Reducing the risk of fraud within the organization", "C": "Improving relationships with suppliers through timely payment", "D": "Supporting long-term sustainability by considering long-term consequences rather than short-term profit alone"}, "answer": "D"}, {"id": 21, "question": "Which pairing of response approach and description is correct?", "options": {"A": "Reactive: anticipates emerging issues and acts before problems occur", "B": "Defensive: responds only after a problem has occurred, without regard to its image", "C": "Accommodative: recognizes stakeholder concerns and takes steps to address them", "D": "Proactive: responds to criticism mainly to protect itself"}, "answer": "C"}, {"id": 22, "question": "Which of the following is NOT a benefit of effective social performance identified in the chapter?", "options": {"A": "Improved organizational reputation", "B": "Complete exemption from legal and regulatory obligations", "C": "Reduced environmental and social risks", "D": "Improved organizational legitimacy"}, "answer": "B"}, {"id": 23, "question": "How do ethical policies help reduce organizational risk?", "options": {"A": "They help limit risks associated with fraud, corruption, discrimination, conflicts of interest, and misconduct", "B": "They remove the need for legal compliance", "C": "They guarantee higher profits every year", "D": "They transfer all liability to employees"}, "answer": "A"}, {"id": 24, "question": "A mining company obeys all laws and pays its taxes, but relocates a village without engaging residents and ignores the resulting hardship. Which principle of corporate citizenship has it failed to apply?", "options": {"A": "Generating revenue and maintaining financial viability", "B": "Complying with applicable laws and regulations", "C": "Recognizing the negative impacts of its activities and taking appropriate responsibility for them", "D": "Paying legitimate taxes"}, "answer": "C"}, {"id": 25, "question": "Customers increasingly demand environmentally responsible products. According to the chapter's example, which first actions would a socially responsive company take?", "options": {"A": "Wait for regulation and then redesign its packaging", "B": "Increase advertising to persuade customers to change their expectations", "C": "Reduce product quality to offset higher environmental costs", "D": "Identify the changing expectation, consult relevant stakeholders, and assess its environmental impact"}, "answer": "D"}, {"id": 26, "question": "A stakeholder is best defined as:", "options": {"A": "only a person who owns shares in the organization", "B": "only an employee who receives a salary from the organization", "C": "an individual, group, or organization that can affect, or is affected by, an organization's activities, decisions, objectives, and performance", "D": "any organization that competes in the same industry"}, "answer": "C"}, {"id": 27, "question": "Which statement about shareholders and stakeholders is correct?", "options": {"A": "All shareholders are stakeholders, but not all stakeholders are shareholders", "B": "All stakeholders are shareholders, but not all shareholders are stakeholders", "C": "Shareholders and stakeholders are exactly the same group", "D": "Shareholders and stakeholders never overlap"}, "answer": "A"}, {"id": 28, "question": "Which of the following is an internal stakeholder?", "options": {"A": "Suppliers", "B": "Media", "C": "Local communities", "D": "Board members"}, "answer": "D"}, {"id": 29, "question": "Which of the following is an external stakeholder?", "options": {"A": "Managers", "B": "Creditors", "C": "Employees", "D": "Owners"}, "answer": "B"}, {"id": 30, "question": "Primary stakeholders are those whose:", "options": {"A": "participation is generally essential to the organization's continued operation", "B": "influence is limited to media coverage", "C": "interests are unrelated to the organization's activities", "D": "role is limited to community advocacy"}, "answer": "A"}, {"id": 31, "question": "Which pairing of stakeholder and typical interest is correct?", "options": {"A": "Creditors: product quality and affordable prices", "B": "Employees: repayment and financial stability", "C": "Government: fair wages and job security", "D": "Suppliers: fair contracts, timely payment, and long-term relationships"}, "answer": "D"}, {"id": 32, "question": "An environmental NGO publicly campaigns against a firm's waste disposal, although it has no direct business transactions with the firm. How should the NGO be classified?", "options": {"A": "A primary stakeholder, because every NGO is essential to continued operation", "B": "A secondary stakeholder, because it can influence the firm without being directly involved in its basic transactions", "C": "An internal stakeholder, because it influences the firm", "D": "Not a stakeholder, because it has no transactions with the firm"}, "answer": "B"}, {"id": 33, "question": "According to stakeholder theory, organizations should:", "options": {"A": "serve only the interests of shareholders", "B": "ignore stakeholders who lack legal authority", "C": "consider the interests of relevant stakeholders rather than focusing exclusively on shareholders", "D": "satisfy every demand made by any stakeholder"}, "answer": "C"}, {"id": 34, "question": "Which description best captures stakeholder management?", "options": {"A": "A systematic process of identifying stakeholders, understanding their interests, assessing their influence, communicating with them, and developing strategies for managing relationships", "B": "Informing shareholders about annual dividends", "C": "Responding only to stakeholders who threaten legal action", "D": "Selecting the stakeholders with the greatest financial power and ignoring the rest"}, "answer": "A"}, {"id": 35, "question": "A company consults community leaders early and learns of concerns about noise before construction begins, so it adjusts its plan and avoids a dispute. Which benefit of stakeholder management does this best illustrate?", "options": {"A": "Increasing shareholder dividends directly", "B": "Eliminating the need for legal compliance", "C": "Reducing conflicts through early identification of stakeholder concerns", "D": "Transferring responsibility to government"}, "answer": "C"}, {"id": 36, "question": "Which question belongs to Step 1 of the stakeholder management process (identify stakeholders)?", "options": {"A": "How urgent are their concerns?", "B": "Which engagement strategy should be used with each group?", "C": "Are the engagement activities producing the desired outcomes?", "D": "Who can influence our organization?"}, "answer": "D"}, {"id": 37, "question": "Which set of questions is used in Step 3, assessing stakeholder power and influence?", "options": {"A": "Who is affected by our decisions?", "B": "How much influence does this stakeholder have, and how urgent are their concerns?", "C": "What do employees, customers, and government want or expect?", "D": "Have surveys and meetings been carried out as planned?"}, "answer": "B"}, {"id": 38, "question": "In Step 4, prioritizing stakeholder engagement, an organization should:", "options": {"A": "determine the appropriate level of engagement, such as close collaboration, regular consultation, information, or periodic monitoring", "B": "engage every stakeholder at exactly the same level", "C": "engage only stakeholders who support the organization", "D": "stop engagement once the strategy has been approved"}, "answer": "A"}, {"id": 39, "question": "A manager asks employees for their views before changing working conditions. Which engagement method is being used?", "options": {"A": "Information", "B": "Partnership", "C": "Consultation", "D": "Collaboration"}, "answer": "C"}, {"id": 40, "question": "Which engagement method involves developing longer-term relationships to achieve shared objectives?", "options": {"A": "Information", "B": "Consultation", "C": "Collaboration", "D": "Partnership"}, "answer": "D"}, {"id": 41, "question": "Which activity represents the final step of the stakeholder management process?", "options": {"A": "Identifying stakeholders affected by decisions", "B": "Monitoring and evaluating whether relationships and engagement activities are producing the desired outcomes", "C": "Developing engagement strategies", "D": "Implementing engagement plans through meetings and surveys"}, "answer": "B"}, {"id": 42, "question": "A company plans layoffs, a reduction in product quality, and lower purchase prices in order to cut costs. Which prediction of stakeholder reactions is consistent with the chapter?", "options": {"A": "Employees may oppose layoffs, customers may oppose reduced quality, and suppliers may oppose lower purchase prices", "B": "Employees will support layoffs to improve profitability, while shareholders oppose cost reduction", "C": "Customers will support lower quality, while suppliers support lower prices", "D": "The community will welcome job losses, while shareholders oppose them"}, "answer": "A"}, {"id": 43, "question": "A manager claims that effective stakeholder management means satisfying every stakeholder demand. Which response is most accurate?", "options": {"A": "The claim is correct, because any unmet demand indicates failure", "B": "The claim is correct, but only for shareholders and employees", "C": "The claim is incorrect; it involves identifying legitimate interests, understanding impacts, communicating transparently, and making responsible decisions", "D": "The claim is incorrect, because stakeholder interests are always compatible"}, "answer": "C"}, {"id": 44, "question": "Why must stakeholder identification precede the design of a CSR program, as in the chapter's mining company example?", "options": {"A": "Because identification ensures that no stakeholder will oppose the program", "B": "Because an organization cannot address the concerns of stakeholders it has not identified, and programs must match the relevant social, environmental, and economic impacts", "C": "Because CSR programs are designed only for investors and government", "D": "Because identification replaces the need for monitoring and evaluation"}, "answer": "B"}, {"id": 45, "question": "A firm planning a new factory applies the stakeholder management process. Which ordering of actions is consistent with the chapter?", "options": {"A": "Develop strategies → identify stakeholders → implement → assess power → understand interests → prioritize → monitor", "B": "Implement → monitor → identify stakeholders → prioritize → understand interests → assess power → develop strategies", "C": "Assess power and influence → implement → identify stakeholders → develop strategies → understand interests → prioritize → monitor", "D": "Identify stakeholders → understand interests → assess power and influence → prioritize engagement → develop strategies → implement → monitor and evaluate"}, "answer": "D"}, {"id": 46, "question": "A small firm depends heavily on a local radio station, while a large firm depends little on any media outlet. Which statement is most consistent with the chapter's classification of stakeholders?", "options": {"A": "The distinction between primary and secondary stakeholders may vary depending on the organization and context", "B": "Media must always be classified as primary stakeholders", "C": "Media can never be stakeholders because they are external", "D": "Classification is fixed and identical for every organization"}, "answer": "A"}, {"id": 47, "question": "Which classification of stakeholders is correct according to the chapter?", "options": {"A": "Employees are external and primary; creditors are internal and secondary", "B": "Owners are external and secondary; media are internal and primary", "C": "Employees are internal and primary; government is external and primary; NGOs are external and secondary", "D": "Board members are external and primary; community groups are internal and secondary"}, "answer": "C"}, {"id": 48, "question": "Why is CSR described as stakeholder-oriented?", "options": {"A": "Because CSR requires organizations to satisfy only the shareholders", "B": "Because CSR is limited to charitable donations to selected groups", "C": "Because stakeholder management replaces the need for legal responsibilities", "D": "Because implementing CSR requires knowing who is affected, what their concerns are, what responsibilities the organization has, what actions to take, and how to evaluate the results"}, "answer": "D"}, {"id": 49, "question": "A firm engages a local university and gains new product ideas, market information, and a joint training partnership. Which benefit of stakeholder management does this best illustrate?", "options": {"A": "Reducing risks by identifying legal and operational concerns", "B": "Identifying opportunities, since stakeholders can provide knowledge, ideas, resources, partnerships, and market information", "C": "Building trust through open communication", "D": "Understanding stakeholder expectations about quality and fairness"}, "answer": "B"}, {"id": 50, "question": "Surveys, public consultations, employee forums, customer feedback channels, and grievance mechanisms mainly belong to which step of the stakeholder management process?", "options": {"A": "Step 6: Implement the strategy", "B": "Step 2: Understand stakeholder interests", "C": "Step 5: Develop engagement strategies", "D": "Step 7: Monitor and evaluate"}, "answer": "A"}, {"id": 51, "question": "Ethical theories are best described as:", "options": {"A": "legal statutes that prescribe penalties for wrongdoing", "B": "systematic principles used to determine whether an action is right or wrong", "C": "financial models used to forecast business outcomes", "D": "organizational policies that apply only to senior managers"}, "answer": "B"}, {"id": 52, "question": "The central question asked by consequentialism is:", "options": {"A": "\"What is my moral duty, and what principle should I follow?\"", "B": "\"What kind of person should I be?\"", "C": "\"What will happen if I take this action?\"", "D": "\"What ethical standards are recognized within this culture?\""}, "answer": "C"}, {"id": 53, "question": "The term deontology is associated with the Greek word deon, which means:", "options": {"A": "duty", "B": "outcome", "C": "character", "D": "custom"}, "answer": "A"}, {"id": 54, "question": "According to utilitarianism, the morally right action is the one that:", "options": {"A": "fulfills a moral duty regardless of the outcome", "B": "best serves the decision-maker's own interests", "C": "conforms to the customs of the local culture", "D": "produces the greatest overall well-being for the greatest number of people"}, "answer": "D"}, {"id": 55, "question": "Virtue ethics focuses mainly on:", "options": {"A": "a person's character and moral qualities such as honesty, integrity, fairness, and courage", "B": "the total consequences of an action for the greatest number", "C": "the personal and cultural frameworks that determine moral judgments", "D": "the obligations created by rules and universal principles"}, "answer": "A"}, {"id": 56, "question": "A manager adopts a work policy that benefits most employees but seriously disadvantages a small group, whose interests are set aside because the majority gains. Which limitation of consequentialism does this illustrate?", "options": {"A": "Future consequences may be difficult to predict", "B": "Duties may conflict with one another", "C": "The interests of a minority may be sacrificed for the majority", "D": "The effects on multiple stakeholders are never considered"}, "answer": "C"}, {"id": 57, "question": "An accountant refuses to falsify a record even though doing so would help the company obtain financing and protect jobs, arguing that honesty is a duty that must be followed whatever the result. Which ethical approach is the accountant applying?", "options": {"A": "Deontology", "B": "Consequentialism", "C": "Ethical egoism", "D": "Cultural ethical relativism"}, "answer": "A"}, {"id": 58, "question": "Which statement correctly distinguishes cultural ethical relativism from individual ethical subjectivism?", "options": {"A": "Cultural relativism emphasizes an individual's personal judgments, whereas subjectivism emphasizes cultural traditions", "B": "Both claim that a single set of moral standards applies identically in every context", "C": "Cultural relativism judges actions by their consequences, whereas subjectivism judges them by duty", "D": "Cultural relativism emphasizes the standards of a particular culture, whereas individual subjectivism emphasizes an individual's own attitudes or beliefs"}, "answer": "D"}, {"id": 59, "question": "Two business owners in the same community and sharing the same cultural background disagree about whether a particular business practice is morally acceptable, because each holds different personal values. This disagreement is best explained by:", "options": {"A": "cultural ethical relativism, because the standards of their shared culture differ", "B": "individual ethical subjectivism, because ethical judgments depend on each person's own attitudes or beliefs", "C": "universal ethical egoism, because each owner must act only in their own interest", "D": "consequentialism, because each owner will calculate identical outcomes"}, "answer": "B"}, {"id": 60, "question": "An entrepreneur invests in employee training because better-skilled employees improve productivity and raise the entrepreneur's long-term profit. According to the chapter, this is most consistent with:", "options": {"A": "deontology, because training is a universal duty owed to every employee", "B": "cultural ethical relativism, because training reflects the customs of the community", "C": "ethical egoism, which does not necessarily mean being greedy or harming others but treats one's own interests as the primary basis for deciding what to do", "D": "virtue ethics, because the investment is motivated purely by compassion"}, "answer": "C"}, {"id": 61, "question": "A person argues that every business owner ought to make decisions that advance their own interests. Which type of ethical egoism is this?", "options": {"A": "Universal ethical egoism", "B": "Personal ethical egoism", "C": "Individual ethical subjectivism", "D": "Cultural ethical relativism"}, "answer": "A"}, {"id": 62, "question": "A manager misleads regulators in order to prevent a plant closure that would cost 200 jobs. Which comparison of the two theories is best supported by the chapter?", "options": {"A": "A deontologist would approve the lie because of its good results, whereas a consequentialist would reject it because lying breaks a duty", "B": "Both theories would approve the lie, because preserving jobs is the only relevant factor", "C": "Both theories would ignore the lie, because ethics concerns only the manager's personal character", "D": "A consequentialist could be tempted to justify the lie by its beneficial outcome, a recognized limitation, whereas a deontologist would hold that honesty matters even when dishonesty could be beneficial"}, "answer": "D"}, {"id": 63, "question": "A procurement officer is bound by a duty to keep a supplier's pricing confidential and also by a duty to disclose all relevant information to an audit committee. Which limitation of deontology does this situation illustrate?", "options": {"A": "Future consequences may be difficult to predict", "B": "Duties may conflict with one another, and deontology may not always give a clear answer when principles conflict", "C": "The interests of a minority may be sacrificed for the majority", "D": "Ethical judgments depend entirely on a cultural framework"}, "answer": "B"}, {"id": 64, "question": "A project team lists how a proposed plant would affect employees, customers, owners, local communities, and the environment. Which main principle of consequentialism is being applied?", "options": {"A": "Duty", "B": "Respect for persons", "C": "Consideration of affected parties", "D": "Comparison of alternatives"}, "answer": "C"}, {"id": 65, "question": "Which pairing of business application and ethical approach is correct according to the chapter?", "options": {"A": "Cost-benefit analysis is associated with consequentialism, whereas anti-corruption policies and confidentiality are associated with deontology", "B": "Cost-benefit analysis is associated with deontology, whereas anti-corruption policies and confidentiality are associated with consequentialism", "C": "Cost-benefit analysis and anti-corruption policies are both associated with ethical relativism", "D": "Cost-benefit analysis is associated with virtue ethics, whereas confidentiality is associated with ethical egoism"}, "answer": "A"}, {"id": 66, "question": "A multinational firm opens a branch in a region where customs about gift-giving and communication with senior managers differ from those at its headquarters. Which question would an ethical relativist ask?", "options": {"A": "\"What will be the overall result of this action for the greatest number?\"", "B": "\"What is my moral duty, and what principle should I follow?\"", "C": "\"Which action best serves my own interests?\"", "D": "\"What ethical standards are recognized within this culture or social context?\""}, "answer": "D"}, {"id": 67, "question": "A student finds a wallet containing money in a university classroom and returns it to its owner. From a virtue ethics perspective, this act is best explained as:", "options": {"A": "a calculation that returning the wallet produces the greatest total benefit", "B": "a demonstration of good moral character, especially honesty and integrity", "C": "an obligation that holds regardless of the student's character", "D": "a decision based on the standards of one particular culture"}, "answer": "B"}, {"id": 68, "question": "Which option correctly matches each ethical approach with its guiding question?", "options": {"A": "Consequentialism: \"What is my moral duty?\"; Deontology: \"What kind of person should I be?\"; Virtue ethics: \"What will happen?\"", "B": "Consequentialism: \"What kind of person should I be?\"; Deontology: \"What will happen?\"; Virtue ethics: \"What is my moral duty?\"", "C": "Consequentialism: \"What will happen if I take this action?\"; Deontology: \"What is my moral duty?\"; Virtue ethics: \"What kind of person should I be?\"", "D": "Consequentialism: \"Which action best serves my interests?\"; Deontology: \"What will happen?\"; Virtue ethics: \"What is my moral duty?\""}, "answer": "C"}, {"id": 69, "question": "A utilitarian is comparing two waste-disposal options for a factory. Which approach is consistent with the chapter?", "options": {"A": "Compare the total benefits and harms of both options, including public health, environmental quality, operating costs, and long-term community welfare", "B": "Choose the cheaper option, because the owners' interests alone determine what is right", "C": "Choose the option that follows a fixed rule regardless of its effects", "D": "Choose the option the manager personally prefers, since ethical judgments are purely individual"}, "answer": "A"}, {"id": 70, "question": "A manager insists that junior staff obey the organization's anti-bribery rule but exempts herself from it. Which analysis is most consistent with the chapter's account of deontology?", "options": {"A": "It is acceptable, because deontology allows managers to be exempt from rules", "B": "It is consistent with universal principles as long as most employees comply", "C": "It is justified because individual subjectivism makes deontology irrelevant", "D": "It violates the principle that moral rules should consistently apply to everyone in relevantly similar situations"}, "answer": "D"}, {"id": 71, "question": "Ethical leadership means:", "options": {"A": "both acting ethically and setting the standard for others to do so as well", "B": "enforcing legal rules through strict supervision and punishment", "C": "maximizing profit while delegating ethical matters to others", "D": "directing employees to follow instructions without question"}, "answer": "A"}, {"id": 72, "question": "A statement of values is best defined as a document that:", "options": {"A": "lists the financial targets of the organization for the coming year", "B": "formally declares the fundamental principles and beliefs that guide the behavior, decisions, and actions of an organization and its members", "C": "records the penalties for each type of rule violation", "D": "sets out a legal contract between an organization and its employees"}, "answer": "B"}, {"id": 73, "question": "In the chapter's list of organizational values, integrity is defined as:", "options": {"A": "telling the truth and avoiding deception", "B": "providing accurate and relevant information openly", "C": "doing the right thing even when nobody is watching", "D": "accepting responsibility for decisions and actions"}, "answer": "C"}, {"id": 74, "question": "An ethical audit is best described as:", "options": {"A": "a one-time training session on the code of ethics for new employees", "B": "a financial review that checks only the accuracy of accounting records", "C": "a document that sets out the moral principles employees are expected to follow", "D": "a systematic assessment of an organization's ethical policies, practices, decisions, and workplace behavior against its stated values, code of ethics, and relevant requirements"}, "answer": "D"}, {"id": 75, "question": "Ethics consultants are:", "options": {"A": "individuals or professional specialists who advise organizations on ethical problems, policies, practices, and decision-making", "B": "employees who are responsible only for approving company budgets", "C": "government officials who investigate corporate crimes", "D": "shareholders who vote on ethical matters at annual meetings"}, "answer": "A"}, {"id": 76, "question": "A manager repeatedly tells staff that honesty is essential but pads her own expense claims, which employees notice. Which responsibility of an ethical leader has she failed to meet, and why does it matter?", "options": {"A": "Allocate resources, because ethics programs require funding", "B": "Lead by example, because employees often observe the behavior of supervisors to determine which practices are genuinely accepted", "C": "Communicate expectations, because she never mentioned honesty", "D": "Take corrective action, because audits had already uncovered the problem"}, "answer": "B"}, {"id": 77, "question": "Employees know of irregularities in procurement but stay silent for fear of being punished. Which leadership responsibility is not being met?", "options": {"A": "Make fair decisions, by avoiding favoritism and personal bias", "B": "Enforce rules consistently, regardless of an employee's position", "C": "Encourage reporting, by allowing employees to raise concerns without fear of retaliation", "D": "Allocate resources, by funding training and monitoring"}, "answer": "C"}, {"id": 78, "question": "A senior manager who violated the company's gift policy receives only an informal warning, while junior employees who committed the same violation are dismissed. Which leadership responsibility has been neglected?", "options": {"A": "Communicate expectations, by explaining values and rules clearly", "B": "Encourage reporting, by protecting employees who raise concerns", "C": "Allocate resources, by providing support for ethics programs", "D": "Enforce rules consistently, applying policies fairly regardless of an employee's position"}, "answer": "D"}, {"id": 79, "question": "Which action best illustrates integrity as the chapter defines it?", "options": {"A": "A storekeeper corrects a stock-count error that favors the company, even though no one would ever discover it", "B": "A manager reports figures accurately only when an audit is expected", "C": "An employee follows safety rules only when a supervisor is present", "D": "An employee withholds information whenever honesty would be costly to them"}, "answer": "A"}, {"id": 80, "question": "An organization's statement of values lists respect and fairness and is displayed on its website, yet managers regularly humiliate staff and favor friends. Which characteristic of an effective statement of values is most clearly missing?", "options": {"A": "Clear: employees should easily understand it", "B": "Demonstrated: managers and leaders should practice the values they promote", "C": "Relevant: it should reflect the organization's purpose", "D": "Communicated: stakeholders should know the values"}, "answer": "B"}, {"id": 81, "question": "Which statement correctly distinguishes a code of ethics from a code of conduct?", "options": {"A": "A code of ethics specifies detailed workplace rules, whereas a code of conduct provides only general moral principles", "B": "A code of ethics applies only to managers, whereas a code of conduct applies only to other employees", "C": "A code of ethics gives general guidance on moral principles and standards, whereas a code of conduct specifies rules and behavioral expectations for particular workplace situations", "D": "They are identical documents and are never used for different purposes"}, "answer": "C"}, {"id": 82, "question": "A procurement officer awards a contract to a relative's company without disclosing the relationship. Which component of a code of ethics and conduct is directly breached?", "options": {"A": "Confidentiality", "B": "Fair treatment and non-discrimination", "C": "Use of organizational resources", "D": "Conflict of interest"}, "answer": "D"}, {"id": 83, "question": "A bank employee tells an unauthorized acquaintance the balance of a customer's account. Which component of the code is breached?", "options": {"A": "Confidentiality", "B": "Anti-corruption and bribery", "C": "Conflict of interest", "D": "Compliance and disciplinary measures"}, "answer": "A"}, {"id": 84, "question": "A supplier pays a procurement officer so that it wins a contract unfairly. Which component of a code of ethics addresses this behavior?", "options": {"A": "Confidentiality", "B": "Anti-corruption and bribery", "C": "Use of organizational resources", "D": "Reporting unethical behavior"}, "answer": "B"}, {"id": 85, "question": "A manager repeatedly selects candidates from her own ethnic group even though other applicants are better qualified. Which component of the code is most directly breached?", "options": {"A": "Confidentiality", "B": "Anti-corruption and bribery", "C": "Fair treatment and non-discrimination", "D": "Compliance and disciplinary measures"}, "answer": "C"}, {"id": 86, "question": "An employee uses organizational funds for personal purchases without authorization. Which component of the code does this breach?", "options": {"A": "Confidentiality", "B": "Reporting unethical behavior", "C": "Health, safety, and environmental responsibility", "D": "Use of organizational resources"}, "answer": "D"}, {"id": 87, "question": "A manufacturing company provides protective equipment to workers and manages industrial waste responsibly. Which component of the code does this reflect?", "options": {"A": "Health, safety, and environmental responsibility", "B": "Honesty and integrity", "C": "Confidentiality", "D": "Use of organizational resources"}, "answer": "A"}, {"id": 88, "question": "An employee discovers financial fraud in her department. Which course of action is consistent with the code of ethics?", "options": {"A": "Ignore it unless a supervisor asks about it", "B": "Report it to the authorized office or designated ethics officer through the appropriate channel", "C": "Discuss it informally with colleagues and take no further action", "D": "Publicly accuse the suspected colleague without following any procedure"}, "answer": "B"}, {"id": 89, "question": "The component of a code dealing with compliance and disciplinary measures should:", "options": {"A": "leave the consequences of violations unspecified to give managers freedom", "B": "apply penalties only to junior employees", "C": "explain applicable requirements, reporting procedures, investigations, and possible consequences of violations, consistent with organizational policies and relevant law", "D": "replace the need to follow relevant laws"}, "answer": "C"}, {"id": 90, "question": "Which of the following is a stated objective of ethics training, as opposed to an objective of ethical audits?", "options": {"A": "Determine whether employees comply with the code of ethics", "B": "Recommend corrective actions", "C": "Evaluate the effectiveness of reporting systems", "D": "Explain reporting procedures and available support"}, "answer": "D"}, {"id": 91, "question": "A company has a code of ethics and has trained its staff. Management now wants evidence of whether employees actually comply with the code and whether the reporting system works. Which mechanism is most appropriate?", "options": {"A": "More ethics training, because training measures compliance by itself", "B": "An ethical audit, because it examines whether the organization actually practices its standards and evaluates training and reporting systems", "C": "A revised statement of values, because wording determines practice", "D": "A consultant hired only to draft a new code, because drafting tests compliance"}, "answer": "B"}, {"id": 92, "question": "Which option correctly matches each situation to the appropriate mechanism? (i) Workshops that help employees recognize ethical dilemmas; (ii) A systematic review of whether staff comply with the code, with recommended corrective actions; (iii) A specialist advising managers on a difficult decision involving competing interests.", "options": {"A": "(i) ethical audit; (ii) ethics training; (iii) ethics consultant", "B": "(i) ethics consultant; (ii) ethics training; (iii) ethical audit", "C": "(i) ethics training; (ii) ethics consultant; (iii) ethical audit", "D": "(i) ethics training; (ii) ethical audit; (iii) ethics consultant"}, "answer": "D"}, {"id": 93, "question": "A company has a code of ethics, but employees report that complaint procedures are unclear, confidentiality is not assured, and complainants are punished. Which response is most consistent with the chapter?", "options": {"A": "Engage an ethics consultant to advise on complaint procedures, whistleblowing systems, confidentiality, and protection against retaliation", "B": "Rewrite the statement of values using more value words", "C": "Reduce ethics training to avoid confusing employees", "D": "Remove the code of ethics to simplify compliance"}, "answer": "A"}, {"id": 94, "question": "An organization's statement of values promises transparency and fairness, but an ethical audit finds widespread favoritism in promotions. Which interpretation is best supported by the chapter?", "options": {"A": "The statement is effective simply because it exists", "B": "The audit is unreliable because values cannot be assessed", "C": "The values are not being applied consistently in practice, and the audit has exposed a gap between stated and actual practice", "D": "Favoritism is acceptable because the code does not mention promotions"}, "answer": "C"}, {"id": 95, "question": "Which statement best describes the relationship among a statement of values, a code of ethics, and a code of conduct?", "options": {"A": "The code of conduct declares fundamental values, while the statement of values lists penalties for violations", "B": "The statement of values declares fundamental principles and beliefs, the code of ethics sets moral principles and standards, and the code of conduct translates them into specific behavioral requirements", "C": "The code of ethics lists specific workplace prohibitions, while the code of conduct states general moral aspirations", "D": "All three are legal documents enforceable only by courts"}, "answer": "B"}, {"id": 96, "question": "An ethical audit reveals weak controls and widespread misunderstanding of policies. Which response by leaders is consistent with the chapter?", "options": {"A": "Keep the findings confidential and take no action, to protect morale", "B": "Discipline only junior employees and leave senior staff unaffected", "C": "Withdraw the code of ethics to avoid further violations", "D": "Take corrective action using the audit findings and allocate resources for training, monitoring, and ethics programs"}, "answer": "D"}, {"id": 97, "question": "An employee accepts an unauthorized gift from a supplier, and the supplier subsequently wins a contract. Which two components of a code of ethics and conduct are most directly engaged?", "options": {"A": "Conflict of interest and anti-corruption and bribery", "B": "Confidentiality and health, safety, and environmental responsibility", "C": "Use of organizational resources and fair treatment", "D": "Reporting unethical behavior and compliance only"}, "answer": "A"}, {"id": 98, "question": "According to the chapter, which combination is most likely to lead employees to act ethically?", "options": {"A": "Strict supervision and penalties, without explanation of values", "B": "A detailed code displayed in the office while leaders exempt themselves from it", "C": "Leaders who set the tone, a clearly defined code of conduct, and fair, respectful, and trusting treatment of employees", "D": "High financial incentives as the only motivation"}, "answer": "C"}, {"id": 99, "question": "Which manager best exemplifies ethical leadership as described in the chapter?", "options": {"A": "A manager who directs staff through strict orders and punishes mistakes without explanation", "B": "A manager who models honesty, explains the organization's values, and guides and nurtures employees", "C": "A manager who hands out the code of conduct and leaves employees to interpret it alone", "D": "A manager who delegates all ethical decisions to another department"}, "answer": "B"}, {"id": 100, "question": "Which of the following is NOT a role of an ethics consultant described in the chapter?", "options": {"A": "Developing or revising codes of ethics and conduct", "B": "Identifying areas where unethical behavior may occur", "C": "Imposing disciplinary penalties on employees found to have violated the code", "D": "Assisting with ethical audits by collecting evidence and recommending improvements"}, "answer": "C"}], "risk": [{"id": 1, "question": "Risk management, as introduced in the unit, is best defined as:", "options": {"A": "the elimination of all uncertainty about the future", "B": "the identification, measurement, and treatment of exposures to potential accidental losses", "C": "the purchase of insurance against every possible loss", "D": "the forecasting of profits for businesses and families"}, "answer": "B"}, {"id": 2, "question": "Williams and Heins define risk as:", "options": {"A": "only the possibility of an unfavorable result", "B": "doubt as to whether a desired outcome will occur", "C": "the variations in the outcomes that could occur over a specified period in a given situation", "D": "the likelihood that a single event will occur"}, "answer": "C"}, {"id": 3, "question": "According to Vaughan's definition, risk exists when:", "options": {"A": "there is a possibility of an adverse (unfavorable) deviation from an outcome that is expected or hoped for", "B": "there is any variation among possible outcomes, whether favorable or not", "C": "a person is in doubt about the future because of imperfect knowledge", "D": "an event is certain to occur"}, "answer": "A"}, {"id": 4, "question": "Which statement best captures the difference between the definitions of Williams and Heins and of Vaughan?", "options": {"A": "Williams and Heins focus only on adverse outcomes, whereas Vaughan focuses on favorable outcomes", "B": "Williams and Heins define risk as a state of mind, whereas Vaughan defines it as a state of the world", "C": "The two definitions are identical and differ only in wording", "D": "Williams and Heins focus on variation in possible outcomes, positive or negative, whereas Vaughan focuses mainly on the possibility of an unfavorable deviation from the expected outcome"}, "answer": "D"}, {"id": 5, "question": "A farmer expects a harvest of 10 tons, but the actual yield could be 6, 10, or 14 tons. Which analysis is consistent with the unit?", "options": {"A": "There is no risk, because the expected yield of 10 tons is known", "B": "Risk is present because outcomes vary and cannot be forecasted with certainty; the 6-ton outcome is the adverse deviation emphasized by Vaughan, while Williams and Heins also count the 14-ton variation", "C": "Risk is present only in the 14-ton outcome, since favorable deviations alone create risk", "D": "Risk exists only after the harvest is complete and the actual yield is known"}, "answer": "B"}, {"id": 6, "question": "Uncertainty is best described as:", "options": {"A": "the variation of actual loss from expected loss", "B": "the specific cause of a loss", "C": "a condition that increases the chance of loss", "D": "doubt as to whether a desired outcome or event will occur, arising from a lack or imperfection of knowledge about the future"}, "answer": "D"}, {"id": 7, "question": "What is meant by the statement \"risk is a state of the world, whereas uncertainty is a state of mind\"?", "options": {"A": "Risk can exist independently of whether a person recognizes it, whereas uncertainty depends on a person's knowledge and attitude", "B": "Risk depends on a person's attitude, whereas uncertainty exists whether or not anyone recognizes it", "C": "Risk and uncertainty are the same thing described from two viewpoints", "D": "Risk exists only in the minds of people who study it"}, "answer": "A"}, {"id": 8, "question": "In the cigarette smoking example, which conclusion is correct?", "options": {"A": "The risk began to exist only when scientific research established the link", "B": "Neither risk nor uncertainty existed until people stopped smoking", "C": "The risk of cancer existed when cigarettes were first consumed, even before the relationship was understood, while uncertainty about health consequences became more apparent once research established the link", "D": "Risk and uncertainty both arose at the moment smoking began"}, "answer": "C"}, {"id": 9, "question": "A worker uses a machine without knowing that it is faulty and dangerous. Which statement is consistent with the unit?", "options": {"A": "There is no risk, because the worker does not know about the fault", "B": "Risk will exist only after the worker discovers the fault", "C": "Risk exists only if an injury actually occurs", "D": "Risk exists even though the worker is unaware of it, because the absence of awareness does not mean the absence of risk"}, "answer": "D"}, {"id": 10, "question": "Two individuals face identical external circumstances but feel differently doubtful about the outcome. Which concept explains this, and what does it show?", "options": {"A": "Risk, which is subjective and therefore differs for each person in identical circumstances", "B": "Uncertainty, which is subjective and based on each person's knowledge and attitude, so different subjective uncertainties are possible in identical circumstances", "C": "Probability, which is determined by each person's attitude toward the event", "D": "Peril, which varies with the knowledge of each person"}, "answer": "B"}, {"id": 11, "question": "Probability is best defined as:", "options": {"A": "the variation among all possible outcomes", "B": "the specific event that causes loss", "C": "the chance or likelihood that a particular event will occur", "D": "doubt arising from imperfect knowledge"}, "answer": "C"}, {"id": 12, "question": "Which statement correctly distinguishes probability from risk?", "options": {"A": "Probability concerns the likelihood of a single event, whereas risk concerns the variation among possible outcomes", "B": "Probability concerns the variation among possible outcomes, whereas risk concerns the likelihood of one event", "C": "Probability concerns only gains, whereas risk concerns only losses", "D": "Probability and risk always have the same numerical value"}, "answer": "A"}, {"id": 13, "question": "If the probability that an event will occur is 1, then:", "options": {"A": "the event is very likely, so there is a high level of risk", "B": "the event may or may not occur, so there is risk", "C": "the event is certain not to occur, so there is no risk", "D": "the event is certain to occur, so there is no variation in outcome and therefore no risk"}, "answer": "D"}, {"id": 14, "question": "For which probability values is there no risk, and why?", "options": {"A": "Probabilities of 0.5 only, because outcomes are equally balanced", "B": "Probabilities of 0 and 1, because the outcome is certain and there is no variation", "C": "Any probability below 1, because the event may not occur", "D": "Probabilities strictly between 0 and 1, because several outcomes are possible"}, "answer": "B"}, {"id": 15, "question": "A merchant spends 100,000 Birr on a coffee shipment. There is a 10% chance that a roadblock spoils part of the cargo, and profit could range from a 30,000 Birr loss to a 250,000 Birr gain. Which analysis is correct?", "options": {"A": "The 10% figure is the risk, whereas the range of financial results is the probability", "B": "Both the 10% figure and the range of results are probabilities", "C": "The 10% chance of the roadblock is a probability of one specific event, whereas the variation across all possible financial outcomes is the risk", "D": "There is no risk, because the probability of the roadblock is below 50%"}, "answer": "C"}, {"id": 16, "question": "A peril is:", "options": {"A": "a specific cause of loss, the immediate event that gives rise to loss", "B": "a condition that increases the chance of loss", "C": "the attitude of an insured person toward loss", "D": "the variation of actual from expected loss"}, "answer": "A"}, {"id": 17, "question": "Which of the following is a hazard rather than a peril?", "options": {"A": "Fire", "B": "Constructing a house from wood", "C": "Theft", "D": "Flood"}, "answer": "B"}, {"id": 18, "question": "A warehouse that stores flammable materials beside an electrical panel is destroyed by fire. Which analysis is correct?", "options": {"A": "The storage arrangement is the peril, and fire is the hazard", "B": "Both the fire and the storage arrangement are perils", "C": "Fire is the peril, and the storage arrangement is a hazard that increased the chance of loss from that peril", "D": "Neither is relevant, because only the insurance policy can be a peril"}, "answer": "C"}, {"id": 19, "question": "The three major types of hazards are:", "options": {"A": "physical hazard, financial hazard, and personal hazard", "B": "moral hazard, speculative hazard, and static hazard", "C": "physical hazard, legal hazard, and fundamental hazard", "D": "physical hazard, moral hazard, and morale hazard"}, "answer": "D"}, {"id": 20, "question": "A shop owner leaves the door unlocked at night, reasoning that the insurer will pay for any theft, and a burglar enters. This is an example of:", "options": {"A": "morale hazard", "B": "physical hazard", "C": "moral hazard", "D": "a peril"}, "answer": "A"}, {"id": 21, "question": "An owner deliberately burns unsold merchandise that is insured in order to collect from the insurer. This is an example of:", "options": {"A": "physical hazard", "B": "moral hazard", "C": "morale hazard", "D": "fundamental risk"}, "answer": "B"}, {"id": 22, "question": "Which statement correctly distinguishes moral hazard from morale hazard?", "options": {"A": "Moral hazard involves carelessness because of insurance, whereas morale hazard involves dishonesty", "B": "Moral hazard concerns physical features of property, whereas morale hazard concerns human attitudes", "C": "Moral hazard involves dishonesty or character defects, whereas morale hazard involves carelessness or indifference because insurance exists", "D": "They are two names for the same hazard"}, "answer": "C"}, {"id": 23, "question": "A motorist drives on an icy road, leaves the car keys in an unlocked car, and later inflates the claim amount. Which classification is correct?", "options": {"A": "Icy road: moral hazard; leaving keys: physical hazard; inflating the claim: morale hazard", "B": "Icy road: morale hazard; leaving keys: moral hazard; inflating the claim: physical hazard", "C": "Icy road: physical hazard; leaving keys: moral hazard; inflating the claim: morale hazard", "D": "Icy road: physical hazard; leaving keys in the car: morale hazard; inflating the claim: moral hazard"}, "answer": "D"}, {"id": 24, "question": "Which statement about hazards and perils is correct?", "options": {"A": "A hazard is not itself the cause of loss, but it increases the chance that a peril will cause loss", "B": "A hazard is the immediate event that causes a loss", "C": "A hazard always refers to the attitude of the insured person", "D": "A hazard and a peril are the same thing under different names"}, "answer": "A"}, {"id": 25, "question": "Pure risk is a situation in which:", "options": {"A": "only a profit or no profit can occur, with no possibility of loss", "B": "only a loss or no loss can occur, with no possibility of profit", "C": "either a profit or a loss is possible", "D": "the entire economy is affected by losses"}, "answer": "B"}, {"id": 26, "question": "Which of the following is an example of speculative risk?", "options": {"A": "A motor accident", "B": "A fire destroying a house", "C": "Theft of a car", "D": "Investing in shares"}, "answer": "D"}, {"id": 27, "question": "A family's breadwinner dies unexpectedly before fulfilling important financial obligations, leaving dependants without income. Which personal risk is this?", "options": {"A": "Premature death", "B": "Insufficient retirement income", "C": "Poor health", "D": "Unemployment"}, "answer": "A"}, {"id": 28, "question": "Match each situation with the correct personal risk: (i) a retiree's resources cannot maintain an acceptable standard of living; (ii) an employer reduces its workforce and a worker loses his job; (iii) a worker cannot earn because of illness and faces medical bills.", "options": {"A": "(i) poor health; (ii) risk of old age; (iii) unemployment", "B": "(i) unemployment; (ii) poor health; (iii) risk of old age", "C": "(i) risk of old age; (ii) unemployment; (iii) poor health", "D": "(i) premature death; (ii) poor health; (iii) risk of old age"}, "answer": "C"}, {"id": 29, "question": "Poor health as a personal risk consists of:", "options": {"A": "the death of a family breadwinner before obligations are met", "B": "loss of income due to inability to work and medical expenses for treatment, medication, and other healthcare", "C": "inadequate income after retirement", "D": "loss of a job because the employer reduces its workforce"}, "answer": "B"}, {"id": 30, "question": "A restaurant building is damaged by fire and the restaurant then loses profits for several months while it is rebuilt. Which classification is correct?", "options": {"A": "The physical damage is an indirect loss, and the lost profits are a direct loss", "B": "Both the physical damage and the lost profits are direct losses", "C": "Both the physical damage and the lost profits are indirect losses", "D": "The physical damage is a direct loss, and the profits lost during rebuilding are an indirect (consequential) loss"}, "answer": "D"}, {"id": 31, "question": "A delivery driver negligently injures a pedestrian, and a court may order the driver's employer to pay compensation. Which type of risk does this represent?", "options": {"A": "Liability risk, because a person may be legally responsible for causing injury to another person", "B": "Property risk, because a vehicle is involved", "C": "Speculative risk, because compensation may be paid or not", "D": "Fundamental risk, because many people may be affected"}, "answer": "A"}, {"id": 32, "question": "Why are pure risks generally insurable while speculative risks generally are not?", "options": {"A": "Pure risks offer a chance of profit, which insurers prefer", "B": "Speculative risks always harm society, so insurers refuse them", "C": "Pure risks are more predictable, allowing insurers to apply the law of large numbers, whereas speculative risks involve uncertainty about both gains and losses", "D": "Insurers prefer risks that affect the whole economy at the same time"}, "answer": "C"}, {"id": 33, "question": "The Law of Large Numbers states that:", "options": {"A": "as the number of exposure units increases, actual results move further from expected results", "B": "as the number of exposure units increases, actual results tend to become closer to expected results", "C": "as the number of exposure units decreases, results become more predictable", "D": "the larger a single loss is, the lower the probability that it will occur"}, "answer": "B"}, {"id": 34, "question": "An insurer expects 5% of insured cars to have an accident each year and insures 400 cars. Using SD = √(npq), what is the standard deviation as a percentage of the expected number of accidents?", "options": {"A": "97.5%", "B": "13.78%", "C": "4.36%", "D": "Approximately 21.8%"}, "answer": "D"}, {"id": 35, "question": "When the number of insured cars rises from 20 to 1,000, the standard deviation rises from 0.975 to 6.89, but the SD as a percentage of expected accidents falls from 97.5% to 13.78%. What is the correct interpretation?", "options": {"A": "The absolute variation increases but the relative variation decreases, so total losses become more predictable, illustrating the Law of Large Numbers", "B": "The relative variation increases, so total losses become less predictable", "C": "The result shows that insuring more cars increases risk per car", "D": "The result shows that the expected accident rate changes from 5% to a lower figure"}, "answer": "A"}, {"id": 36, "question": "Which statement about the effects of pure and speculative risk on society is consistent with the unit?", "options": {"A": "Losses from pure risks generally benefit society, whereas speculative risks always harm it", "B": "Pure and speculative risks both only harm society", "C": "Losses from pure risks generally harm society, whereas a speculative risk may benefit society by leading to innovation, improved efficiency, or lower-cost products", "D": "Pure and speculative risks have no effect on society"}, "answer": "C"}, {"id": 37, "question": "A tsunami destroys coastal towns and affects thousands of people at the same time. This is an example of:", "options": {"A": "particular risk", "B": "fundamental risk", "C": "static risk affecting only an individual", "D": "speculative risk"}, "answer": "B"}, {"id": 38, "question": "Why are fundamental risks generally not covered by private insurance, and what role may government play?", "options": {"A": "They affect only one person, and government never participates in insurance", "B": "They always involve profit, which private insurers cannot cover", "C": "They are fully insurable by private insurers but are ignored for convenience", "D": "They affect large numbers of people at the same time, although government may sometimes provide insurance or protection, for example against unemployment"}, "answer": "D"}, {"id": 39, "question": "Which pairing is correct?", "options": {"A": "Fire destroying one family's house is a particular risk, whereas war is a fundamental risk", "B": "Fire destroying one family's house is a fundamental risk, whereas war is a particular risk", "C": "Both a house fire and war are fundamental risks", "D": "High inflation is a particular risk, whereas car theft is a fundamental risk"}, "answer": "A"}, {"id": 40, "question": "A single business owner may either earn a profit or suffer a loss from the business. How is this risk best classified?", "options": {"A": "A fundamental risk, because it affects the entire economy", "B": "An insurable risk, because every particular risk is insurable", "C": "A particular risk, because it affects one owner, but generally not insurable because it is a speculative risk", "D": "A pure risk, because a loss is possible"}, "answer": "C"}, {"id": 41, "question": "Which risk is most likely to be insurable by a private insurance company?", "options": {"A": "High inflation, because it affects many people", "B": "Theft of a car, because it is a particular pure risk", "C": "Investing in shares, because it may produce a profit or a loss", "D": "A business's profit or loss, because it is a particular risk"}, "answer": "B"}, {"id": 42, "question": "Which of the following is an example of financial risk?", "options": {"A": "Choosing a marriage partner", "B": "Deciding whether to have children", "C": "Selecting food from a restaurant menu", "D": "Loss of business income following a fire"}, "answer": "D"}, {"id": 43, "question": "Which statement correctly describes non-financial risk?", "options": {"A": "Its consequences cannot be adequately measured in monetary terms and are mainly evaluated using personal, emotional, or social criteria, as in choosing a marriage partner", "B": "Its consequences are always expressed in money", "C": "It occurs only when no financial consequence is possible", "D": "It arises only from damage to property"}, "answer": "A"}, {"id": 44, "question": "Which statement about the premature death of a family breadwinner is supported by the unit?", "options": {"A": "It involves only a financial risk", "B": "It involves only a non-financial risk", "C": "It can involve a financial risk, the loss of income, and non-financial losses, such as emotional support, guidance, and motivation, at the same time", "D": "Financial and non-financial risks can never occur together"}, "answer": "C"}, {"id": 45, "question": "A change in technology makes a firm's main product obsolete. How is this risk best classified?", "options": {"A": "Static risk, because it occurs without any change in the economy", "B": "Dynamic risk, because it originates from changes in the overall economy such as technology", "C": "Subjective risk, because it depends on a person's state of mind", "D": "Pure risk, because only a loss can result"}, "answer": "B"}, {"id": 46, "question": "Which statement correctly compares dynamic and static risk?", "options": {"A": "Dynamic risks are more predictable and easily controlled, whereas static risks are unpredictable", "B": "Static risks arise only from changes in the economy, whereas dynamic risks do not", "C": "Both are equally predictable and controllable", "D": "Static risks can occur even without changes in the economy and are more predictable and controllable through loss prevention, whereas dynamic risks are less predictable and often beyond the control of risk managers"}, "answer": "D"}, {"id": 47, "question": "Which classification of events is correct? (i) a shift in consumer tastes; (ii) theft of a car; (iii) accidental injury to a worker; (iv) a change in political conditions.", "options": {"A": "(i) dynamic; (ii) static; (iii) static; (iv) dynamic", "B": "(i) static; (ii) dynamic; (iii) dynamic; (iv) static", "C": "(i) dynamic; (ii) dynamic; (iii) static; (iv) static", "D": "(i) static; (ii) static; (iii) dynamic; (iv) dynamic"}, "answer": "A"}, {"id": 48, "question": "An insurer insures 5,000 houses, of which 2% on average burn each year. In one year 85 houses burn. What is the relative variation of actual from expected loss (objective risk)?", "options": {"A": "0.3%", "B": "85%", "C": "15%", "D": "1.5%"}, "answer": "C"}, {"id": 49, "question": "Subjective risk is best described as:", "options": {"A": "the relative variation of actual loss from expected loss", "B": "uncertainty based on a person's mental condition or state of mind, often expressed as a degree of belief", "C": "losses that originate from changes in the overall economy", "D": "a risk that affects the entire economy"}, "answer": "B"}, {"id": 50, "question": "Two people who have been drinking heavily face the same situation. One calls a taxi, while the other drives carelessly. Which interpretation is consistent with the unit?", "options": {"A": "Their objective risk must differ, because their conduct differs", "B": "Both persons have identical conduct, because the situation is identical", "C": "No subjective risk exists, because only the driver faces a loss", "D": "Their subjective risk differs because perceptions differ; the person who perceives a high risk behaves more carefully, whereas the person who perceives a low risk may behave carelessly"}, "answer": "D"}, {"id": 51, "question": "Risk management, as defined in Unit 2, is best described as:", "options": {"A": "a systematic process for identifying and evaluating pure loss exposures and for selecting and implementing the most appropriate techniques for treating them", "B": "a process for evaluating speculative investments so that profit is maximized", "C": "the purchase of insurance for every exposure the organization faces", "D": "the elimination of all losses by avoiding every risky activity"}, "answer": "A"}, {"id": 52, "question": "Which exposures form the main focus of risk management according to the unit?", "options": {"A": "Speculative risks only, because they offer a chance of profit", "B": "Only those pure risks that can be insured", "C": "Only risks that have already caused a loss to the firm", "D": "Pure risks, both insurable and uninsurable, covering property, liability, and personal exposures"}, "answer": "D"}, {"id": 53, "question": "A risk manager estimates how often losses may occur and how serious they could be. Which duty is being performed?", "options": {"A": "Assessing frequency and severity", "B": "Identifying loss exposures", "C": "Selecting risk-handling methods", "D": "Administering and monitoring programs"}, "answer": "A"}, {"id": 54, "question": "Match each activity with the correct duty of the risk manager: (i) recording, reviewing, and monitoring risk management activities; (ii) choosing among avoidance, retention, prevention, self-insurance, or insurance; (iii) identifying potential sources of loss.", "options": {"A": "(i) select risk-handling methods; (ii) identify loss exposures; (iii) administer and monitor programs", "B": "(i) identify loss exposures; (ii) administer and monitor programs; (iii) select risk-handling methods", "C": "(i) administer and monitor programs; (ii) select risk-handling methods; (iii) identify loss exposures", "D": "(i) administer and monitor programs; (ii) identify loss exposures; (iii) select risk-handling methods"}, "answer": "C"}, {"id": 55, "question": "Which of the following is a pre-loss objective of risk management?", "options": {"A": "Survival of the firm", "B": "Continued growth of the firm", "C": "Stability of earnings", "D": "Reduction of anxiety"}, "answer": "D"}, {"id": 56, "question": "A risk manager compares the cost of a sprinkler system with the cost of insurance premiums and selects the method that gives appropriate protection at a reasonable cost. Which objective is being pursued?", "options": {"A": "Reduction of anxiety", "B": "Stability of earnings", "C": "Economy", "D": "Meeting externally imposed obligations"}, "answer": "C"}, {"id": 57, "question": "Government regulations require a firm to install safety devices to protect employees from workplace injuries. Which risk management objective does compliance with this requirement serve?", "options": {"A": "Economy", "B": "Stability of earnings", "C": "Meeting externally imposed obligations", "D": "Social responsibility"}, "answer": "C"}, {"id": 58, "question": "Which grouping of objectives into pre-loss and post-loss categories is correct?", "options": {"A": "Pre-loss: economy, survival, continued growth; post-loss: reduction of anxiety, externally imposed obligations, social responsibility", "B": "Pre-loss: economy, reduction of anxiety, externally imposed obligations; post-loss: survival, continued operations, stability of earnings, continued growth, social responsibility", "C": "Pre-loss: reduction of anxiety, stability of earnings, social responsibility; post-loss: economy, survival, continued operations", "D": "Pre-loss: survival, continued operations, continued growth; post-loss: economy, reduction of anxiety, externally imposed obligations"}, "answer": "B"}, {"id": 59, "question": "A manufacturing plant is seriously damaged by fire. Effective risk management should help the firm resume at least partial operations within a reasonable time rather than close permanently. Which objective is this?", "options": {"A": "Economy", "B": "Survival of the firm", "C": "Continued growth of the firm", "D": "Reduction of anxiety"}, "answer": "B"}, {"id": 60, "question": "A public electricity supplier must keep providing power to customers even after a serious loss, because the public depends on the service. Which post-loss objective does this illustrate?", "options": {"A": "Continued operations", "B": "Stability of earnings", "C": "Continued growth of the firm", "D": "Meeting externally imposed obligations"}, "answer": "A"}, {"id": 61, "question": "After a fire, a firm wants its earnings to stay relatively steady instead of falling sharply. Which post-loss objective is this?", "options": {"A": "Stability of earnings", "B": "Continued growth of the firm", "C": "Economy", "D": "Reduction of anxiety"}, "answer": "A"}, {"id": 62, "question": "A firm intends to develop new products and enter new markets and wants to ensure a major loss does not prevent those plans. Which post-loss objective is this?", "options": {"A": "Survival of the firm", "B": "Continued growth of the firm", "C": "Social responsibility", "D": "Stability of earnings"}, "answer": "B"}, {"id": 63, "question": "A severe loss forces a factory in a small community to close for a long time, causing unemployment, reduced local business, and lower tax revenues. Why does the unit say risk management should consider such effects?", "options": {"A": "Because the firm's earnings are guaranteed to recover once the community recovers", "B": "Because only the government is concerned about the effects of a loss on others", "C": "Because social responsibility requires minimizing the negative effects of a loss on employees, customers, suppliers, creditors, taxpayers, and the community, not only the firm's own interests", "D": "Because social responsibility is a pre-loss objective that replaces the economy objective"}, "answer": "C"}, {"id": 64, "question": "Which sequence correctly lists the four steps of the risk management process?", "options": {"A": "Select risk management tools, identify potential losses, implement the program, evaluate potential losses", "B": "Evaluate potential losses, implement the program, identify potential losses, select tools", "C": "Identify potential losses, evaluate (measure) potential losses, select risk management tools, implement and administer the program", "D": "Implement the program, identify potential losses, select tools, evaluate potential losses"}, "answer": "C"}, {"id": 65, "question": "Risk identification is best defined as:", "options": {"A": "the process by which a business systematically and continuously identifies personal, property, and liability loss exposures as soon as or before they emerge", "B": "the measurement of the potential size and probability of a loss", "C": "the selection of avoidance, retention, or insurance for each exposure", "D": "the implementation and monitoring of the chosen risk treatment program"}, "answer": "A"}, {"id": 66, "question": "A risk identifier studies a diagram of the firm's structure and relationships to see where risks may exist across departments and functions. Which technique is being used?", "options": {"A": "Contract analysis", "B": "Checklists", "C": "Financial statement method", "D": "Organization chart"}, "answer": "D"}, {"id": 67, "question": "A risk manager walks through a plant to examine machinery, the physical layout, the processes carried out, and earlier inspection reports. Which technique is this?", "options": {"A": "Flow chart analysis", "B": "Checklist", "C": "Interaction with other departments", "D": "Physical inspection"}, "answer": "D"}, {"id": 68, "question": "Head office sends a standardized questionnaire to branch staff to complete, instead of visiting every branch, in order to identify loss exposures. Which technique is this?", "options": {"A": "Physical inspection", "B": "Checklist", "C": "Contract analysis", "D": "Organization chart"}, "answer": "B"}, {"id": 69, "question": "Which pairing of the two types of checklist with their descriptions is correct?", "options": {"A": "Insurance policy checklist: identifies common sources of loss in an industry; exposure unit checklist:
