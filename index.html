lists available insurance policies", "B": "Insurance policy checklist: records the firm's past claims; exposure unit checklist: lists the firm's contracts", "C": "Both types list only the firm's insured property and nothing else", "D": "Insurance policy checklist: lists common insurable risks and the policies that cover them; exposure unit checklist: identifies common sources of loss exposure within a specific industry or organization"}, "answer": "D"}, {"id": 70, "question": "A risk manager maps the sequence of activities from raw material supply to delivery of finished goods to find critical points, weaknesses, and bottlenecks where equipment failure or supply shortages could disrupt operations. Which technique is this?", "options": {"A": "Organization chart", "B": "Flow charts", "C": "Financial statement method", "D": "Contract analysis"}, "answer": "B"}, {"id": 71, "question": "A risk manager examines each account on the balance sheet, and reviews income statements, budgets, and forecasts, to detect property, liability, and human asset exposures, as well as future risks. Which technique is this?", "options": {"A": "Financial statement method", "B": "Physical inspection", "C": "Organization chart", "D": "Checklist"}, "answer": "A"}, {"id": 72, "question": "Match each activity with the correct identification technique: (i) reviewing supplier agreements to see who bears liability; (ii) regular meetings with the production department to learn about risks not visible elsewhere; (iii) analyzing budgets and forecasts.", "options": {"A": "(i) interactions with other departments; (ii) contract analysis; (iii) financial statement method", "B": "(i) financial statement method; (ii) contract analysis; (iii) interactions with other departments", "C": "(i) contract analysis; (ii) financial statement method; (iii) interactions with other departments", "D": "(i) contract analysis; (ii) interactions with other departments; (iii) financial statement method"}, "answer": "D"}, {"id": 73, "question": "A business operates 5 delivery trucks. A truck involved in an accident is a total loss, and new trucks are bought each year so that the fleet always starts the year with 5. Which distribution method suits this case and why?", "options": {"A": "The binomial distribution, because n units are independently exposed and each experiences at most one loss in a year", "B": "The Poisson distribution, because each truck can suffer several accidents a year", "C": "The Poisson distribution, because the trucks are never replaced", "D": "Neither, because the number of exposure units changes each year"}, "answer": "A"}, {"id": 74, "question": "A firm operated 8 vans in each of 5 years (40 van-years) and recorded 6 accidents in total. Using the unit's method, what is the expected number of accidents next year for the 8 vans?", "options": {"A": "0.15 accidents", "B": "6 accidents", "C": "1.2 accidents", "D": "0.75 accidents"}, "answer": "C"}, {"id": 75, "question": "Three units are independently exposed, each with a probability of accident of 0.2. Using P(r) = [n! ÷ ((n − r)! r!)] pʳ qⁿ⁻ʳ, what is the probability of exactly one accident?", "options": {"A": "0.384", "B": "0.128", "C": "0.096", "D": "0.512"}, "answer": "A"}, {"id": 76, "question": "A fleet has n = 20 units, and the probability of an accident per unit is p = 0.1. What are the mean and standard deviation of the number of accidents under the binomial distribution?", "options": {"A": "Mean = 2.0; SD = 1.80", "B": "Mean = 2.0; SD ≈ 1.34", "C": "Mean = 1.8; SD ≈ 1.34", "D": "Mean = 18; SD ≈ 4.24"}, "answer": "B"}, {"id": 77, "question": "For the same fleet (n = 20, p = 0.1, mean = 2, SD ≈ 1.342), what are the risk relative to the mean (RM) and the risk relative to the number of exposure units (Rn)?", "options": {"A": "RM ≈ 6.7% and Rn ≈ 67.1%", "B": "RM ≈ 67.1% and Rn ≈ 67.1%", "C": "RM ≈ 67.1% and Rn ≈ 6.7%", "D": "RM ≈ 90% and Rn ≈ 9%"}, "answer": "C"}, {"id": 78, "question": "Which statement correctly distinguishes risk relative to the mean (RM) from risk relative to the number of exposure units (Rn)?", "options": {"A": "RM divides the standard deviation by the number of exposure units, whereas Rn divides it by the mean", "B": "RM measures the probability of an accident, whereas Rn measures the monetary loss", "C": "RM and Rn are identical and are always equal", "D": "RM expresses the standard deviation as a proportion of the expected number of accidents, whereas Rn expresses it as a percentage of the total number of exposure units"}, "answer": "D"}, {"id": 79, "question": "A fleet of 20 trucks has p = 0.1, so 2 accidents are expected per year, and each accident costs on average Br 8,000. What is the expected total annual monetary loss?", "options": {"A": "Br 16,000", "B": "Br 8,000", "C": "Br 2,000", "D": "Br 80,000"}, "answer": "A"}, {"id": 80, "question": "For the same fleet (SD of accidents ≈ 1.342, loss per accident Br 8,000, expected annual loss Br 16,000), what are the standard deviation of total monetary loss and the risk relative to the mean monetary loss?", "options": {"A": "SD ≈ Br 16,000; RM ≈ 1.0", "B": "SD ≈ Br 8,000; RM ≈ 0.5", "C": "SD ≈ Br 10,733; RM ≈ 0.67", "D": "SD ≈ Br 1,342; RM ≈ 0.08"}, "answer": "C"}, {"id": 81, "question": "Three independent units each have an accident probability of 0.2. What is the probability that the firm will experience some loss, meaning at least one accident?", "options": {"A": "0.512", "B": "0.488", "C": "0.384", "D": "0.200"}, "answer": "B"}, {"id": 82, "question": "What is the only data input required to construct a Poisson distribution of accidents?", "options": {"A": "The number of units and the probability of no accident, separately", "B": "The mean, that is, the expected or average number of accidents", "C": "The total value of all exposure units", "D": "The largest loss recorded in previous years"}, "answer": "B"}, {"id": 83, "question": "A firm holds many properties of different values. Any one property can suffer more than one accident in a year, and damaged property is not replaced. Which distribution and which assumptions apply?", "options": {"A": "The binomial distribution, because exposure units are independent and each has at most one loss", "B": "The binomial distribution, because the number of units is fixed by replacement", "C": "The Poisson distribution, whose assumptions are that object values may differ, each object can suffer more than one accident, and there is no replacement", "D": "No distribution can be used, because the values differ"}, "answer": "C"}, {"id": 84, "question": "Over 10 years a firm recorded 12 accidents against a total of 150 car-years of exposure. In year 11 it operates 50 cars. What are the Poisson mean and standard deviation for year 11?", "options": {"A": "M = 4 accidents; SD = 4", "B": "M = 12 accidents; SD ≈ 3.46", "C": "M = 0.08 accidents; SD ≈ 0.28", "D": "M = 4 accidents; SD = 2"}, "answer": "D"}, {"id": 85, "question": "For a Poisson distribution with mean M = 2, and using e = 2.71828, what is the probability of exactly 3 accidents?", "options": {"A": "Approximately 0.180", "B": "Approximately 0.271", "C": "Approximately 0.090", "D": "Approximately 0.135"}, "answer": "A"}, {"id": 86, "question": "For a Poisson distribution with mean M = 2, what is the probability that at least 2 accidents occur, using P(0) ≈ 0.1353 and P(1) ≈ 0.2707?", "options": {"A": "Approximately 0.406", "B": "Approximately 0.594", "C": "Approximately 0.271", "D": "Approximately 0.865"}, "answer": "B"}, {"id": 87, "question": "A Poisson distribution gives P(r ≥ 3) = 0.80 and P(r ≥ 10) = 0.04. What is the probability of 3 or more but fewer than 10 accidents?", "options": {"A": "0.84", "B": "0.76", "C": "0.04", "D": "0.80"}, "answer": "B"}, {"id": 88, "question": "In year 11 a firm expects M = 4 accidents. From past records, the loss per accident is total loss ÷ total accidents = Br 36,000 ÷ 12 = Br 3,000. What is the expected total annual monetary loss?", "options": {"A": "Br 3,000", "B": "Br 36,000", "C": "Br 12,000", "D": "Br 9,000"}, "answer": "C"}, {"id": 89, "question": "With M = 4, SD of accidents = 2, loss per accident Br 3,000, and expected loss Br 12,000, what are the standard deviation of monetary loss and the risk relative to the mean monetary loss?", "options": {"A": "SD = Br 6,000; RM = 0.50", "B": "SD = Br 12,000; RM = 1.0", "C": "SD = Br 3,000; RM = 0.25", "D": "SD = Br 6,000; RM = 2.0"}, "answer": "A"}, {"id": 90, "question": "With 50 cars exposed and a Poisson SD of 2 accidents, what is the risk relative to the number of exposure units (Rn)?", "options": {"A": "50%", "B": "4%", "C": "25%", "D": "2%"}, "answer": "B"}, {"id": 91, "question": "How does risk financing differ from risk control?", "options": {"A": "Risk financing aims to prevent losses, whereas risk control provides money after losses", "B": "Risk financing applies only to insurable risks, whereas risk control applies only to speculative risks", "C": "They are the same approach under different names", "D": "Risk financing provides money to cover losses after they occur, whereas risk control aims to reduce the likelihood and severity of losses and make them more predictable"}, "answer": "D"}, {"id": 92, "question": "A company decides not to build a factory in a flood-prone area. Which risk control tool is being used?", "options": {"A": "Loss reduction", "B": "Separation", "C": "Retention", "D": "Avoidance"}, "answer": "D"}, {"id": 93, "question": "Which statement correctly explains the main limitation of avoidance?", "options": {"A": "It is often impractical, because businesses must own buildings, vehicles, and machinery to operate, and avoiding every risk could end the business", "B": "It never eliminates the possibility of loss", "C": "It is useful only for risks that cannot be controlled in any other way", "D": "It increases the severity of the losses that remain"}, "answer": "A"}, {"id": 94, "question": "Which classification is correct?", "options": {"A": "A burglar alarm is loss reduction, whereas fire extinguishers are loss prevention", "B": "All safety devices are loss prevention, because they act before the loss", "C": "Fire extinguishers and burglar alarms are both risk financing tools", "D": "A burglar alarm is loss prevention, whereas fire extinguishers and first-aid kits are loss reduction"}, "answer": "D"}, {"id": 95, "question": "A company stores its inventory in several warehouses in different towns instead of one. Which tool is this?", "options": {"A": "Combination", "B": "Separation", "C": "Diversification", "D": "Avoidance"}, "answer": "B"}, {"id": 96, "question": "Match each action with the correct tool: (i) a farmer grows several crops instead of relying on one; (ii) two firms merge to increase the number of exposure units and make losses more predictable; (iii) a firm holds inventory in several warehouses.", "options": {"A": "(i) combination; (ii) separation; (iii) diversification", "B": "(i) separation; (ii) diversification; (iii) combination", "C": "(i) diversification; (ii) separation; (iii) combination", "D": "(i) diversification; (ii) combination (pooling); (iii) separation"}, "answer": "D"}, {"id": 97, "question": "The three main risk financing tools are:", "options": {"A": "retention, non-insurance transfer, and insurance", "B": "avoidance, separation, and diversification", "C": "loss prevention, loss reduction, and combination", "D": "retention, avoidance, and loss reduction"}, "answer": "A"}, {"id": 98, "question": "In which situation is retention most appropriate?", "options": {"A": "Past records allow the firm to predict its losses accurately, and the worst possible loss would not seriously affect its financial position", "B": "The worst possible loss is catastrophic and cannot be predicted", "C": "Losses are rare but extremely costly and unpredictable", "D": "Insurance is available at a low premium and the loss would be large"}, "answer": "A"}, {"id": 99, "question": "Which statement correctly describes retention (self-insurance)?", "options": {"A": "It transfers the financial burden to an insurer and removes the risk of large losses", "B": "It is appropriate mainly for large, unpredictable losses, since it protects against them", "C": "It saves insurance premiums and gives control over claim handling, but the firm bears the entire financial burden, and large unexpected losses may create financial problems", "D": "It is the same as avoidance, because the firm stops the risky activity"}, "answer": "C"}, {"id": 100, "question": "Which classification of non-insurance transfers is correct? (i) selling a building; (ii) a contract under which an event organizer, and not the venue owner, must pay for damage during an event.", "options": {"A": "(i) transfer of the activity or property; (ii) transfer of the probable loss through a contract", "B": "(i) transfer of the probable loss through a contract; (ii) transfer of the activity or property", "C": "(i) insurance; (ii) retention", "D": "(i) avoidance; (ii) separation"}, "answer": "A"}, {"id": 101, "question": "A firm evaluates four exposures: (i) frequent but minor vehicle damage; (ii) rare but very costly factory fire; (iii) frequent and severe losses; (iv) rare and minor losses. Which matching to the selection matrix is correct?", "options": {"A": "(i) insurance; (ii) retention; (iii) avoidance; (iv) retention and reduction", "B": "(i) retention and reduction; (ii) insurance; (iii) avoidance; (iv) retention", "C": "(i) avoidance; (ii) retention and reduction; (iii) insurance; (iv) retention", "D": "(i) retention; (ii) avoidance; (iii) insurance; (iv) retention and reduction"}, "answer": "B"}, {"id": 102, "question": "In an insurance contract, the insured (transferor) is:", "options": {"A": "the insurance company that accepts the risk in exchange for a premium", "B": "the party that pays no premium but receives all protection", "C": "the person or organization that faces the risk and pays a premium to obtain protection", "D": "the regulatory authority that approves the contract"}, "answer": "C"}, {"id": 103, "question": "An insurer insures 5,000 houses, each worth Br 200,000, and on average 3 houses burn each year. If the expected loss is shared equally among policyholders, what premium does each contribute?", "options": {"A": "Br 600", "B": "Br 120", "C": "Br 40", "D": "Br 3,000"}, "answer": "B"}, {"id": 104, "question": "A town has 200 houses, each costing Br 80,000 to rebuild. One house is destroyed by a storm and the cost is shared equally among all 200 families. How much does each family contribute, and which characteristic of insurance does this show?", "options": {"A": "Br 80,000 each; indemnification", "B": "Br 400 each; risk avoidance", "C": "Br 160 each; fortuitous loss", "D": "Br 400 each; pooling (sharing) of losses"}, "answer": "D"}, {"id": 105, "question": "Which statement correctly applies the law of large numbers to insurance?", "options": {"A": "As the group gets larger, the error in predicting losses increases", "B": "The law applies only when losses are deliberately caused", "C": "The law makes the loss of each individual insured predictable", "D": "As the number of exposure units in the group increases, the error in predicting future losses decreases and predicted experience approaches actual loss experience"}, "answer": "D"}, {"id": 106, "question": "A house is destroyed by a covered fire and the insurer compensates the owner according to the policy. What is the purpose of this compensation?", "options": {"A": "To place the insured in a better financial position than before the loss", "B": "To give a free gift, since insurance is a form of charity", "C": "To restore the insured to approximately the same financial position as before the loss", "D": "To transfer ownership of the property to the insurer for the premium paid"}, "answer": "C"}, {"id": 107, "question": "Which statement correctly explains why insurance is not charity, and what risk transfer means?", "options": {"A": "Insurance is charity, because the insurer pays more than it receives; and risk transfer moves responsibility from the insurer to the insured", "B": "Insurance is not charity only because the insurer earns a profit; risk transfer means the insured keeps all financial responsibility", "C": "Insurance is charity when the insured does not suffer a loss; risk transfer is the same as retention", "D": "The insured must pay a premium to receive protection, whereas charity is given freely without expecting payment; and risk transfer moves financial responsibility for a covered pure risk from the insured to the insurer"}, "answer": "D"}, {"id": 108, "question": "A fortuitous loss is best defined as:", "options": {"A": "a loss that happens unexpectedly, accidentally, and by chance, without the insured intentionally causing it", "B": "a loss that the insured deliberately arranges in order to claim compensation", "C": "a loss that is certain to occur at a known time", "D": "a loss that affects everyone in an economy at once"}, "answer": "A"}, {"id": 109, "question": "Which insurer can estimate fire losses more reliably, and why?", "options": {"A": "An insurer covering 100,000 similar houses, because a large number of homogeneous exposure units lets it use the law of large numbers", "B": "An insurer covering only 10 houses, because small groups are easier to analyze", "C": "An insurer covering 10 very different kinds of properties, because variety reduces error", "D": "Both are equally reliable, because group size does not affect prediction"}, "answer": "A"}, {"id": 110, "question": "Among 1,000 insured cars, 20 are damaged in accidents in one case, and in another case 200 owners deliberately damage their cars to claim insurance. Why does the second case make the risk uninsurable?", "options": {"A": "Intentional losses are more predictable, which lowers insurance costs", "B": "Intentional losses create moral hazard and are no longer random, which makes losses unpredictable and raises insurance costs", "C": "Intentional losses improve the operation of the law of large numbers", "D": "Intentional losses are insurable as long as the premium is paid"}, "answer": "B"}, {"id": 111, "question": "An insurer cannot establish when, where, or how much a claimed loss was, so it cannot tell whether the loss falls within the policy period or the covered area. Which requirement of an insurable risk is not met?", "options": {"A": "There must be no catastrophic loss", "B": "The premium must be economically feasible", "C": "The loss must be determinable and calculable in terms of cause, place, time, and amount", "D": "There must be a large number of homogeneous exposure units"}, "answer": "C"}, {"id": 112, "question": "An insurer writes policies only on houses in a single river valley, and a flood threatens almost all of them at once. Which measures can reduce this catastrophic risk?", "options": {"A": "Charging premiums only after losses occur, and insuring only intentional losses", "B": "Concentrating more policies in the valley, and avoiding any reinsurance", "C": "Reinsurance, transferring part of the risk to a reinsurer, and geographical diversification, spreading coverage across different areas", "D": "Insuring only losses whose cause, place, and time are unknown"}, "answer": "C"}, {"id": 113, "question": "For an insurer to set an appropriate premium under the calculable chance of loss requirement, it must estimate average frequency and severity of losses. What must the premium be enough to cover?", "options": {"A": "Only expected claims", "B": "Only the insurer's expenses and profit", "C": "Claims for losses the insured has deliberately caused", "D": "Expected claims, insurance company expenses, and a reasonable profit"}, "answer": "D"}, {"id": 114, "question": "The probability of loss for a particular exposure is extremely high. Why is it unsuitable for private insurance?", "options": {"A": "The premium would be too low for the insurer to remain profitable", "B": "A high probability of loss makes the loss unpredictable by definition", "C": "The insurer would have to charge a very high premium, so the premium would no longer be substantially lower than the potential loss", "D": "Insurance only covers losses with certain outcomes"}, "answer": "C"}, {"id": 115, "question": "A firm wants insurance against a fall in the market price of its shares. Why is this generally difficult to insure privately?", "options": {"A": "It is a personal risk, and personal risks cannot be insured privately", "B": "It is a financial or market risk that is often speculative, may have greater catastrophic potential, and has a loss probability that is hard to determine, making premium calculation difficult", "C": "It is a liability risk with a clearly determinable probability", "D": "It is a property risk, and property risks are insurable only by governments"}, "answer": "B"}, {"id": 116, "question": "Which statement correctly distinguishes insurance from speculation?", "options": {"A": "Insurance aims at profit from price changes, whereas speculation aims at protection against loss", "B": "Insurance deliberately accepts uninsurable risk, whereas speculation transfers it to an insurer", "C": "Both insurance and speculation reduce objective risk through the law of large numbers", "D": "Insurance transfers an insurable risk for protection against loss and can reduce objective risk through the law of large numbers, whereas speculation deliberately accepts risk in the hope of profit from future price changes and does not reduce risk that way"}, "answer": "D"}, {"id": 117, "question": "One man places a bet on a football match while another buys fire insurance for his house. Which analysis is consistent with the unit?", "options": {"A": "Both create new risks in the hope of making a profit", "B": "The bet creates a new risk in the hope of gain, whereas fire insurance transfers an existing risk to protect against loss", "C": "The bet deals with an existing risk, whereas fire insurance creates a new one", "D": "Both transfer an existing risk to a third party for protection"}, "answer": "B"}, {"id": 118, "question": "How does insurance help reduce the cost of capital?", "options": {"A": "Insurers refuse to invest premiums, which keeps interest rates stable", "B": "Insurers pay claims before collecting premiums, which reduces the funds available", "C": "Insurers collect premiums in advance and invest them, increasing the supply of loanable funds, which can lower borrowing costs and encourage economic growth", "D": "Insurance reduces the cost of capital by eliminating all risk"}, "answer": "C"}, {"id": 119, "question": "A shop owner sleeps peacefully because she knows that fire damage to her stock would be compensated. Which importance of insurance does this illustrate?", "options": {"A": "Less worry and fear", "B": "Source of investment funds", "C": "Loss control", "D": "Reduction of the cost of capital"}, "answer": "A"}, {"id": 120, "question": "Why do insurers encourage loss prevention and safety measures even though insurance mainly spreads losses?", "options": {"A": "Because loss prevention eliminates the need for any premiums", "B": "Because if losses increase, insurers pay more claims, their profits may decrease, and premiums may need to rise", "C": "Because insurers are legally required to prevent all losses", "D": "Because higher losses always increase insurers' profits"}, "answer": "B"}]};
let current=[],course='',index=0,answers={};
let timeLeft=0, timerInterval=null;
const quizMinutes={business:100,risk:120};

function startTimer(minutes){
 clearInterval(timerInterval);
 timeLeft=minutes*60;
 updateTimer();
 timerInterval=setInterval(()=>{
   timeLeft--;
   updateTimer();
   if(timeLeft<=0){
     clearInterval(timerInterval);
     alert('Time is up! Your quiz will now be submitted.');
     showResult();
   }
 },1000);
}
function updateTimer(){
 const mins=Math.floor(Math.max(timeLeft,0)/60);
 const secs=Math.max(timeLeft,0)%60;
 document.getElementById('timer').textContent=`Time: ${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
}

function startQuiz(name){
 course=name; current=quizzes[name]; index=0; answers={};
 document.getElementById('home').classList.add('hidden');
 document.getElementById('result').classList.add('hidden');
 document.getElementById('quiz').classList.remove('hidden');
 document.getElementById('courseTitle').textContent=name==='business'?'Business Ethics':'Risk Management & Insurance';
 startTimer(quizMinutes[name]);
 renderQuestion();
}
function renderQuestion(){
 const q=current[index];
 document.getElementById('counter').textContent=`Question ${index+1} of ${current.length}`;
 document.getElementById('bar').style.width=((index+1)/current.length*100)+'%';
 document.getElementById('question').textContent=q.question;
 let out='';
 Object.entries(q.options).forEach(([letter,text])=>{
  const checked=answers[index]===letter?'checked':'';
  out+=`<label class="option"><input type="radio" name="answer" value="${letter}" ${checked} onchange="answers[${index}]='${letter}'"> <b>${letter}.</b> ${text}</label>`;
 });
 document.getElementById('options').innerHTML=out;
 document.getElementById('nextBtn').textContent=index===current.length-1?'Submit Quiz':'Next';
}
function nextQuestion(){
 if(!answers[index]){alert('Please select an answer before continuing.');return;}
 if(index===current.length-1){showResult();}else{index++;renderQuestion();}
}
function previousQuestion(){if(index>0){index--;renderQuestion();}}
function showResult(){
 clearInterval(timerInterval);
 document.getElementById('quiz').classList.add('hidden');
 document.getElementById('result').classList.remove('hidden');
 let correct=current.filter((q,i)=>answers[i]===q.answer).length;
 let pct=Math.round(correct/current.length*100);
 document.getElementById('score').textContent=`${correct} / ${current.length} (${pct}%)`;
 document.getElementById('message').textContent=pct>=80?'Excellent work!':pct>=50?'Good effort! Keep practicing.':'Keep studying and try again!';
 document.getElementById('review').classList.add('hidden');
}
function reviewAnswers(){
 const r=document.getElementById('review'); r.classList.remove('hidden');
 r.innerHTML='<h2>Answer Review</h2>'+current.map((q,i)=>{
   const user=answers[i]||'No answer'; const ok=user===q.answer;
   return `<div class="quiz-card"><b>Q${i+1}. ${q.question}</b><p class="${ok?'correct':'wrong'}">Your answer: ${user} ${ok?'✓':'✗'}</p><p class="correct">Correct answer: ${q.answer}. ${q.options[q.answer]}</p></div>`;
 }).join('');
}
function goHome(){
 document.getElementById('result').classList.add('hidden');
 document.getElementById('quiz').classList.add('hidden');
 document.getElementById('home').classList.remove('hidden');
}
</script>
</body></html>
