<p class="mu">Note: the source PDF has no answer key. Correct answers were worked out for this page; for calculation questions please double-check against your own working.</p></div>`;
app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{S.src=+b.dataset.s;S.auto=1;home()});
app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{S.cnt=+b.dataset.c||9999;S.auto=1;home()});
document.getElementById('go').onclick=()=>{S.mins=Math.max(1,+document.getElementById('mn').value||k);S.practice=document.getElementById('pr').checked;S.auto=0;start()}}
function start(){let pool=D.filter(q=>S.src<0||q[0]==S.src);if(S.src<0)pool=pool.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]);
pool=pool.slice(0,Math.min(S.cnt,pool.length));X={qs:pool,ans:{},fl:{},i:0,end:Date.now()+S.mins*60000,done:false,t0:Date.now()};
clearInterval(T);T=setInterval(tick,500);exam()}
function tick(){if(!X||X.done)return;const r=Math.round((X.end-Date.now())/1000),t=document.getElementById('tm');if(t){t.textContent=fmt(r);t.classList.toggle('lo',r<300)}if(r<=0)submit(true)}
function pal(){return X.qs.map((q,i)=>{let c='';if(X.done){const a=X.ans[i];c=a===undefined?'':a==q[4]?'ok':'bad'}else if(X.ans[i]!==undefined)c='an';if(X.fl[i])c+=' fg';if(i==X.i)c+=' cu';return`<button class="${c}" data-i="${i}">${i+1}</button>`}).join('')}
function exam(){const q=X.qs[X.i],i=X.i,a=X.ans[i],rev=S.practice&&a!==undefined;const n=X.qs.length,ansd=Object.keys(X.ans).length;
app.innerHTML=`<div class="bar"><div class="w"><button id="hm">← Home</button><span class="mu">Answered ${ansd}/${n}</span><span class="tm" id="tm">${fmt(Math.round((X.end-Date.now())/1000))}</span></div></div><div class="w">
<div class="card"><div class="row"><span><span class="tag">Q ${i+1} of ${n}</span><span class="tag">${e(P[q[0]])} · #${q[1]}</span></span><button id="fg">${X.fl[i]?'⚑ Flagged':'⚐ Flag'}</button></div>
<div class="q">${e(q[2])}</div>${q[3].map((o,j)=>`<button class="o ${rev?(j==q[4]?'ok':j==a?'bad':''):(a==j?'sel':'')}" data-o="${j}"><b>${L[j]}.</b><span>${e(o)}</span></button>`).join('')}
${rev?`<div class="ex">${a==q[4]?'✔ Correct':'✘ Incorrect'} — correct answer: <b>${L[q[4]]}. ${e(q[3][q[4]])}</b></div>`:''}
<div class="nav"><button id="pv" ${i==0?'disabled':''}>← Previous</button><button id="cl" ${a===undefined?'disabled':''}>Clear</button>${i<n-1?'<button class="p" id="nx">Next →</button>':'<button class="d" id="sb">Submit Exam</button>'}</div></div>
<div class="card"><div class="row"><b>Question navigator</b><button class="d" id="sb2">Submit Exam</button></div><p class="mu" style="margin:4px 0 10px">Blue = answered · orange outline = flagged · black outline = current</p><div class="pal">${pal()}</div></div></div>`;
const g=id=>document.getElementById(id);
app.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{X.ans[i]=+b.dataset.o;exam()});
app.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{X.i=+b.dataset.i;exam();scrollTo(0,0)});
g('hm').onclick=()=>{if(confirm('Leave the exam and go back to Home? Your progress will be lost.'))home()};
g('fg').onclick=()=>{X.fl[i]=!X.fl[i];exam()};g('pv').onclick=()=>{X.i--;exam();scrollTo(0,0)};g('cl').onclick=()=>{delete X.ans[i];exam()};
if(g('nx'))g('nx').onclick=()=>{X.i++;exam();scrollTo(0,0)};if(g('sb'))g('sb').onclick=()=>submit(false);g('sb2').onclick=()=>submit(false)}
function submit(auto){if(!auto){const u=X.qs.length-Object.keys(X.ans).length;if(!confirm(u?`You have ${u} unanswered question${u>1?'s':''}. Submit the exam now?`:'Submit the exam now?'))return}
X.done=true;X.used=Math.min(Math.round((Date.now()-X.t0)/1000),S.mins*60);clearInterval(T);X.f='all';result(auto)}
function result(auto){const n=X.qs.length;let ok=0,wr=0;X.qs.forEach((q,i)=>{const a=X.ans[i];if(a===undefined)return;a==q[4]?ok++:wr++});const un=n-ok-wr,pc=Math.round(ok/n*1000)/10;
const list=X.qs.map((q,i)=>[q,i]).filter(([q,i])=>{const a=X.ans[i];return X.f=='all'||(X.f=='wrong'&&a!==undefined&&a!=q[4])||(X.f=='un'&&a===undefined)});
app.innerHTML=`<header class="top"><div class="w"><h1>🎓 Exam Result</h1></div></header><div class="w"><div class="card" style="text-align:center">${auto?'<p class="mu">Time is up — the exam was submitted automatically.</p>':''}<div class="big" style="color:${pc>=50?'var(--ok)':'var(--no)'}">${ok} / ${n} (${pc}%)</div>
<p>✔ Correct <b>${ok}</b> · ✘ Wrong <b>${wr}</b> · Unanswered <b>${un}</b> · Time used <b>${fmt(X.used)}</b></p>
<div class="chips" style="justify-content:center"><button class="p" id="rt">Retake</button><button id="hm">← Back to Home</button></div></div>
<div class="card"><b>Navigator</b><div class="pal" style="margin-top:8px">${pal()}</div></div>
<h2>Review &amp; correct answers</h2><div class="chips">${[['all','All'],['wrong','Wrong'],['un','Unanswered']].map(([k,t])=>`<button class="chip ${X.f==k?'on':''}" data-f="${k}">${t}</button>`).join('')}</div>
${list.map(([q,i])=>{const a=X.ans[i];return`<div class="card" id="r${i}"><span class="tag">Q ${i+1}</span><span class="tag">${e(P[q[0]])} · #${q[1]}</span><div class="q">${e(q[2])}</div>${q[3].map((o,j)=>`<div class="o ${j==q[4]?'ok':j==a?'bad':''}"><b>${L[j]}.</b><span>${e(o)}${j==q[4]?' ✔':j==a?' (your answer)':''}</span></div>`).join('')}<div class="ex" style="background:${a==q[4]?'var(--okb)':'var(--nob)'}">${a===undefined?'Not answered':a==q[4]?'Correct':'Your answer: '+L[a]} · Correct answer: <b>${L[q[4]]}</b></div></div>`}).join('')||'<p class="mu">Nothing to show.</p>'}</div>`;
document.getElementById('rt').onclick=start;document.getElementById('hm').onclick=home;
app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{X.f=b.dataset.f;result(false)});
app.querySelectorAll('.pal [data-i]').forEach(b=>b.onclick=()=>{X.f='all';result(false);document.getElementById('r'+b.dataset.i).scrollIntoView()})}
home();
</script></body></html>
